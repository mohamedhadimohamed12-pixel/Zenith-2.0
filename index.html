/* ---- flashcard image attachments (front/back, optional) ---- */
function zReadImageFile(file){
  return new Promise((resolve, reject)=>{
    if(!file) return resolve(null);
    if(!file.type.startsWith('image/')) return reject(new Error('Please choose an image file.'));
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 1600;
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.88));
      };
      img.onerror = ()=>reject(new Error('Could not read that image.'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read that image.'));
    reader.readAsDataURL(file);
  });
}
function zImageFieldHtml(prefix, existingImage, existingLayout, showLayout){
  if(showLayout === undefined) showLayout = true;
  const hasImg = !!existingImage;
  return `
    <div class="img-field-wrap" id="${prefix}ImgWrap">
      <input type="file" accept="image/*" id="${prefix}ImgInput" style="display:none;">
      <input type="hidden" id="${prefix}ImgData" value="${existingImage ? zEsc(existingImage) : ''}">
      <input type="hidden" id="${prefix}ImgLayout" value="${zEsc(existingLayout||'below')}">
      <div id="${prefix}ImgArea">
        ${hasImg ? zImagePreviewHtml(prefix, existingImage, existingLayout, showLayout) : `
        <button type="button" class="img-upload-btn" id="${prefix}ImgBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          Add image
        </button>`}
      </div>
    </div>`;
}
function zImagePreviewHtml(prefix, dataUrl, layout, showLayout){
  if(showLayout === undefined) showLayout = true;
  return `
    <div class="img-preview">
      <img src="${dataUrl}" alt="">
      <button type="button" class="img-preview-remove" id="${prefix}ImgRemove">✕</button>
    </div>
    ${showLayout ? `
    <div class="layout-toggle-row" id="${prefix}ImgLayoutRow">
      <button type="button" data-layout="below" class="${layout!=='caption'?'active':''}">Text below</button>
      <button type="button" data-layout="caption" class="${layout==='caption'?'active':''}">Text as caption</button>
    </div>` : ''}`;
}
function zWireImageField(backdrop, prefix, textareaId, showLayout){
  if(showLayout === undefined) showLayout = true;
  const area = backdrop.querySelector('#'+prefix+'ImgArea');
  const dataInput = backdrop.querySelector('#'+prefix+'ImgData');
  const layoutInput = backdrop.querySelector('#'+prefix+'ImgLayout');
  const fileInput = backdrop.querySelector('#'+prefix+'ImgInput');
  function wirePreviewControls(){
    backdrop.querySelector('#'+prefix+'ImgRemove')?.addEventListener('click', ()=>{
      dataInput.value = ''; layoutInput.value = 'below';
      area.innerHTML = `
        <button type="button" class="img-upload-btn" id="${prefix}ImgBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
          Add image
        </button>`;
      wireUploadBtn();
    });
    backdrop.querySelector('#'+prefix+'ImgLayoutRow')?.querySelectorAll('button').forEach(b=>{
      b.addEventListener('click', ()=>{
        layoutInput.value = b.dataset.layout;
        backdrop.querySelector('#'+prefix+'ImgLayoutRow').querySelectorAll('button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
      });
    });
  }
  function wireUploadBtn(){
    backdrop.querySelector('#'+prefix+'ImgBtn')?.addEventListener('click', ()=>fileInput.click());
  }
  fileInput.addEventListener('change', async ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    try{
      const dataUrl = await zReadImageFile(file);
      dataInput.value = dataUrl;
      area.innerHTML = zImagePreviewHtml(prefix, dataUrl, layoutInput.value, showLayout);
      wirePreviewControls();
    }catch(err){
      zToast(err.message || 'Could not load that image.');
    } finally {
      fileInput.value = '';
    }
  });
  wireUploadBtn();
  wirePreviewControls();
}
function zRenderFace(text, imageData, layout){
  const hasText = !!(text && text.trim());
  const hasImg = !!imageData;
  if(hasImg && !hasText) return `<img class="face-img" src="${imageData}" alt="">`;
  if(hasImg && hasText && layout==='caption') return `<img class="face-img" src="${imageData}" alt=""><div class="face-caption">${zBidi(text)}</div>`;
  if(hasImg && hasText) return `<div class="face-img-wrap"><img class="face-img" src="${imageData}" alt=""></div><div class="face-text">${zBidi(text)}</div>`;
  return zBidi(text);
}
function zFaceClass(text, imageData, layout){
  const hasText = !!(text && text.trim());
  const hasImg = !!imageData;
  if(hasImg && !hasText) return 'has-image img-only';
  if(hasImg && hasText && layout==='caption') return 'has-image img-caption';
  if(hasImg && hasText) return 'has-image img-below';
  return '';
}

function zStudySwitchModule(mod){

/* ---- global-within-module utilities: locate a folder, leeches, recursive study ---- */
async function zFolderPath(folderStore, folderId){
  const all = await zGetAll(folderStore);
  const path = [];
  let cur = folderId;
  while(cur && cur !== ZROOT){
    const f = all.find(x=>x.id===cur);
    if(!f) break;
    path.unshift({ id:f.id, name:f.name });
    cur = f.parentId;
  }
  return path;
}
async function zStudyLocateFolder(mod, folderId){
  const cfg = STUDY_MODULES[mod];
  const path = await zFolderPath(cfg.folderStore, folderId);
  zStudyState = { module:mod, folderId, path };
  document.querySelectorAll('.study-subtab').forEach(b=>b.classList.toggle('active', b.dataset.mod===mod));
  document.getElementById('leechesBtn').style.display = mod === 'fc' ? '' : 'none';
  zCloseModal();
  zSwitchTab('study');
}
async function zShowLeechesModal(){
  const allCards = await zGetAll('fc_cards');
  const leeches = allCards.filter(c=>c.isLeech);
  if(!leeches.length){ zToast('No leech cards right now — nice.'); return; }
  const rows = await Promise.all(leeches.map(async c=>{
    const path = await zFolderPath('fc_folders', c.folderId);
    return `<div class="item-row" onclick="zStudyLocateFolder('fc','${c.folderId}')">
      <div class="ibody"><div class="ifront">${zBidi(c.front)}</div><div class="iback">${zBidi(path.map(p=>p.name).join(' / '))}</div></div>
    </div>`;
  }));
  zOpenModal(`Leeches (${leeches.length})`, `<p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Cards you keep getting wrong. Tap one to jump to it.</p><div>${rows.join('')}</div>`);
}
async function zCollectItemsRecursive(folderStore, itemStore, folderId){
  let items = await zFolderItems(itemStore, folderId);
  const subs = await zFolderChildren(folderStore, folderId);
  for(const s of subs){
    items = items.concat(await zCollectItemsRecursive(folderStore, itemStore, s.id));
  }
  return items;
}
async function zStartFlashcardSessionAll(){
  const items = await zCollectItemsRecursive('fc_folders', 'fc_cards', zStudyState.folderId);
  zStartFlashcardSession(items);
}
async function zStartQuizSessionAll(){
  const items = await zCollectItemsRecursive('qz_folders', 'qz_quizzes', zStudyState.folderId);
  zStartQuizSessionGoWithItems(items);
}
function zStudyNavigate(folderId, name){
  zStudyState.path.push({ id:folderId, name });
  zStudyState.folderId = folderId;
  zRenderStudy();
}
function zStudyCrumbTo(index){
  zStudyState.path = zStudyState.path.slice(0, index);
  zStudyState.folderId = index === 0 ? ZROOT : zStudyState.path[index-1].id;
  zRenderStudy();
}

async function zRenderStudy(){
  const root = document.getElementById('studyRoot');
  if(!root) return;
  const cfg = STUDY_MODULES[zStudyState.module];
  const folderId = zStudyState.folderId;

  // breadcrumb
  let crumbHtml = `<span class="crumb ${folderId===ZROOT?'current':''}" onclick="zStudyCrumbTo(0)">${cfg.label}</span>`;
  zStudyState.path.forEach((p,i)=>{
    const isLast = i === zStudyState.path.length - 1;
    crumbHtml += `<span class="crumb-sep">/</span><span class="crumb ${isLast?'current':''}" onclick="zStudyCrumbTo(${i+1})">${zBidi(p.name)}</span>`;
  });

  if(folderId === ZROOT){
    const folders = await zFolderChildren(cfg.folderStore, ZROOT);
    _zStudyLeafState = false;
    const allBtn = zStudyState.module === 'fc'
      ? `<button class="zbtn" style="width:100%; margin-bottom:12px;" onclick="zStartFlashcardSessionAll()">▶ Study all due cards</button>`
      : zStudyState.module === 'qz'
      ? `<button class="zbtn" style="width:100%; margin-bottom:12px;" onclick="zStartQuizSessionAll()">▶ Practice all questions</button>`
      : '';
    root.innerHTML = `
      <div class="crumbbar">${crumbHtml}</div>
      ${folders.length ? allBtn : ''}
      ${folders.length ? `<div class="folder-list">${folders.map(f=>zFolderRowHtml(f)).join('')}</div>`
        : `<div class="zempty"><div class="ph-icon">▢</div><p>No ${cfg.label.toLowerCase()} yet. Tap + to create your first folder.</p></div>`}
    `;
    zShowFab(true);
    return;
  }

  const leaf = await zFolderIsLeaf(cfg.folderStore, cfg.itemStore, folderId);
  _zStudyLeafState = leaf;

  if(leaf === false){
    const folders = await zFolderChildren(cfg.folderStore, folderId);
    const allBtn = zStudyState.module === 'fc'
      ? `<button class="zbtn" style="width:100%; margin-bottom:12px;" onclick="zStartFlashcardSessionAll()">▶ Study all due cards in this folder</button>`
      : zStudyState.module === 'qz'
      ? `<button class="zbtn" style="width:100%; margin-bottom:12px;" onclick="zStartQuizSessionAll()">▶ Practice all questions in this folder</button>`
      : '';
    root.innerHTML = `
      <div class="crumbbar">${crumbHtml}</div>
      ${folders.length ? allBtn : ''}
      ${folders.length ? `<div class="folder-list">${folders.map(f=>zFolderRowHtml(f)).join('')}</div>`
        : `<div class="zempty"><div class="ph-icon">▢</div><p>Empty. Tap + to add a subfolder.</p></div>`}
    `;
    zShowFab(true);
    return;
  }

  if(leaf === true){
    const items = await zFolderItems(cfg.itemStore, folderId);
    const sessionBtn = zStudyState.module === 'fc'
      ? `<button class="zbtn zbtn-accent" style="width:100%;margin-bottom:12px;" onclick="zStartFlashcardSession()">▶ Study this deck (${items.length} cards)</button>`
      : zStudyState.module === 'qz'
      ? `<button class="zbtn zbtn-accent" style="width:100%;margin-bottom:12px;" onclick="zStartQuizSession()">▶ Practice this deck (${items.length} questions)</button>`
      : '';
    root.innerHTML = `
      <div class="crumbbar">${crumbHtml}</div>
      ${items.length ? sessionBtn : ''}
      ${items.length ? `<div>${items.map(it=>zItemRowHtml(it)).join('')}</div>`
        : `<div class="zempty"><div class="ph-icon">▢</div><p>Empty. Tap + to add your first ${cfg.addLabel.toLowerCase()}.</p></div>`}
    `;
    zShowFab(true);
    return;
  }

  // empty / undetermined folder — offer both choices
  root.innerHTML = `
    <div class="crumbbar">${crumbHtml}</div>
    <div class="zempty">
      <div class="ph-icon">▢</div>
      <p>This folder is empty. Choose what it holds:</p>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="zbtn" style="flex:1" onclick="zPromptNewFolder()">+ Subfolder</button>
      <button class="zbtn zbtn-accent" style="flex:1" onclick="zOpenItemForm()">+ ${cfg.addLabel}</button>
    </div>
  `;
  zShowFab(false);
}

async function zRenameFolder(id){
  const name = prompt('New name:');
  if(!name) return;
  const cfg = STUDY_MODULES[zStudyState.module];
  const db = await zOpenDB();
  const tx = db.transaction(cfg.folderStore, 'readwrite');
  const os = tx.objectStore(cfg.folderStore);
  const req = os.get(id);
  req.onsuccess = ()=>{ const f = req.result; f.name = name; os.put(f); };
  tx.oncomplete = ()=>{ zCloseModal(); zRenderStudy(); };
}
async function zDeleteFolder(id){
  if(!confirm('Delete this folder and everything inside it? This cannot be undone.')) return;
  const cfg = STUDY_MODULES[zStudyState.module];
  await zDeleteFolderRecursive(cfg.folderStore, cfg.itemStore, id);

  zRenderStudy();

async function zDeleteFolderRecursive(folderStore, itemStore, id){
  const subs = await zFolderChildren(folderStore, id);
  for(const s of subs) await zDeleteFolderRecursive(folderStore, itemStore, s.id);
  const items = await zFolderItems(itemStore, id);
  for(const it of items) await zDel(itemStore, it.id);
  await zDel(folderStore, id);
}
async function zDeleteItem(id){
  if(!confirm('Delete this item?')) return;

  await zDel(cfg.itemStore, id);

function zRenderBlanksSetup(passage){
  const tokens = zTokenize(passage.text);
  zOpenModal(passage.title, `
    <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">Tap the words you want to turn into blanks, then start.</p>
    <div class="ps-passage-text" id="psBlankSetup" dir="auto">${tokens.map((t,i)=> zIsWordTok(t) ? `<span class="tok-word" data-i="${i}">${zEsc(t)}</span>` : zEsc(t)).join('')}</div>
    <button class="zbtn zbtn-accent" id="psStartBlankTest" style="width:100%;">Start test</button>
  `, (body)=>{
    const selected = new Set();
    body.querySelectorAll('#psBlankSetup .tok-word').forEach(el=>{
      el.addEventListener('click', ()=>{
        const i = el.dataset.i;
        if(selected.has(i)){ selected.delete(i); el.classList.remove('blanked'); }
        else { selected.add(i); el.classList.add('blanked'); }
      });
    });
    body.querySelector('#psStartBlankTest').addEventListener('click', ()=>{
      if(!selected.size){ zToast('Tap at least one word to blank out.'); return; }
      zRenderBlanksTest(passage, tokens, [...selected].map(Number));
    });
  });
}
function zRenderBlanksTest(passage, tokens, blankIndices){
  const html = tokens.map((t,i)=>{
    if(blankIndices.includes(i)) return `<input type="text" class="blank-input" data-i="${i}" data-answer="${zEsc(t)}" autocomplete="off">`;
    return zEsc(t);
  }).join('');
  zOpenModal(passage.title, `
    <div class="ps-passage-text" dir="auto" id="psBlankTest">${html}</div>
    <button class="zbtn zbtn-accent" id="psCheckBlanks" style="width:100%;">Check answers</button>
    <div id="psBlankResultWrap"></div>
  `, (body)=>{
    body.querySelector('#psCheckBlanks').addEventListener('click', ()=>{
      const inputs = [...body.querySelectorAll('.blank-input')];
      let correct = 0;
      inputs.forEach(inp=>{
        const ok = zNormTok(inp.value) === zNormTok(inp.dataset.answer);
        inp.classList.add(ok ? 'correct' : 'incorrect');
        inp.disabled = true;
        if(ok) correct++;
        else{
          const hint = document.createElement('span');
          hint.className = 'blank-hint';
          hint.textContent = inp.dataset.answer;
          inp.insertAdjacentElement('afterend', hint);
        }
      });
      const pct = inputs.length ? Math.round((correct/inputs.length)*100) : 0;
      body.querySelector('#psCheckBlanks').style.display = 'none';
      const wrap = body.querySelector('#psBlankResultWrap');
      wrap.innerHTML = `<button class="zbtn zbtn-accent" style="width:100%; margin-top:14px;" id="psSaveBlanks">Save score: ${pct}%</button>`;
      wrap.querySelector('#psSaveBlanks').addEventListener('click', ()=>zSavePassageScore(pct, 'blanks'));
    });
  });
}

function zRenderFading(passage){
  const tokens = zTokenize(passage.text);
  const wordSpans = tokens.map((t,i)=> zIsWordTok(t) ? `<span class="fade-word" data-i="${i}">${zEsc(t)}</span>` : zEsc(t)).join('');
  zOpenModal(passage.title, `
    <div class="ps-fade-controls">
      <span style="font-size:12.5px; color:var(--text-muted);">Fade speed</span>
      <input type="range" id="psFadeSpeed" min="10" max="120" value="30">
      <span style="font-size:12.5px; color:var(--text-muted);" id="psFadeSpeedLabel">30s</span>
    </div>
    <div class="ps-passage-text" id="psFadeText" dir="auto">${wordSpans}</div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button class="zbtn" style="flex:1" id="psStartFade">Start fade</button>
      <button class="zbtn" style="flex:1" id="psRevealFade">Reveal</button>
    </div>
    <div id="psFadeRateWrap"></div>
  `, (body)=>{
    const speed = body.querySelector('#psFadeSpeed');
    const label = body.querySelector('#psFadeSpeedLabel');
    speed.addEventListener('input', ()=>{ label.textContent = speed.value + 's'; });
    const words = [...body.querySelectorAll('.fade-word')];
    body.querySelector('#psStartFade').addEventListener('click', ()=>{
      const totalSec = Number(speed.value);
      const perWordFade = Math.max(0.4, Math.min(1.2, totalSec / Math.max(words.length,1) * 2));
      words.forEach(w=>{ w.style.transition='none'; w.style.opacity='1'; });
      requestAnimationFrame(()=>{
        words.forEach((w,idx)=>{
          const delay = (idx / Math.max(words.length,1)) * totalSec;
          w.style.transition = `opacity ${perWordFade}s linear ${delay}s`;
          w.style.opacity = '0.06';
        });
      });
    });
    body.querySelector('#psRevealFade').addEventListener('click', ()=>{
      words.forEach(w=>{ w.style.transition='opacity .3s ease'; w.style.opacity='1'; });
    });
    const rateWrap = body.querySelector('#psFadeRateWrap');
    rateWrap.innerHTML = `<div style="font-size:12px; color:var(--text-muted); margin-top:10px; margin-bottom:4px;">How well did you recall it?</div>${zSelfRateRowHtml()}`;
    zWireSelfRate(rateWrap, pct=>zSavePassageScore(pct, 'fading'));
  });
}

function zRenderBoxes(passage){
  const tokens = zTokenize(passage.text);
  zOpenModal(passage.title, `
    <p style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;">Tap a box to peek at the word — it hides again after a moment.</p>
    <div class="ps-passage-text" dir="auto">${tokens.map((t,i)=> zIsWordTok(t) ? `<span class="tok-box" data-i="${i}">${zEsc(t)}</span>` : zEsc(t)).join('')}</div>

function zRenderTyping(passage){
  const target = passage.text;
  zOpenModal(passage.title, `
    <div style="font-size:12.5px; color:var(--text-muted); margin-bottom:8px;" id="typingStats">0 WPM · 100% accuracy · 0 / ${target.length} characters</div>
    <div class="ps-passage-text ps-typing-display" id="typingDisplay" dir="auto"></div>
    <textarea class="ps-typing-input" id="typingInput" rows="4" placeholder="Start typing here…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div style="display:flex; gap:8px; margin:10px 0;"><button class="zbtn" id="typingRestart">Restart</button></div>
    <div id="typingRateWrap"></div>
  `, (body)=>{
    const displayEl = body.querySelector('#typingDisplay');
    const inputEl = body.querySelector('#typingInput');
    const statsEl = body.querySelector('#typingStats');
    let startTime = null, finished = false;
    function renderDisplay(typed){
      let html=''; let errors=0;
      for(let i=0;i<target.length;i++){
        const ch = target[i]; const chEsc = zEsc(ch);
        if(i<typed.length){
          if(typed[i]===ch) html += `<span class="ty-correct">${chEsc}</span>`;
          else { html += `<span class="ty-incorrect">${chEsc===' '?'&nbsp;':chEsc}</span>`; errors++; }
        } else if(i===typed.length){ html += `<span class="ty-cursor">${chEsc}</span>`; }
        else html += `<span class="ty-pending">${chEsc}</span>`;
      }
      displayEl.innerHTML = html;
      return errors;
    }
    function updateStats(typed, errors){
      const elapsedMin = startTime ? Math.max((Date.now()-startTime)/60000, 1/60000) : 1/60000;
      const wpm = Math.round((typed.length/5)/elapsedMin);
      const acc = typed.length ? Math.round(((typed.length-errors)/typed.length)*100) : 100;
      statsEl.textContent = `${wpm} WPM · ${acc}% accuracy · ${typed.length} / ${target.length} characters`;
      return {wpm, acc};
    }
    renderDisplay('');
    inputEl.addEventListener('input', ()=>{
      if(finished) return;
      if(!startTime) startTime = Date.now();
      let typed = inputEl.value;
      if(typed.length > target.length) typed = typed.slice(0, target.length);
      const errors = renderDisplay(typed);
      const {wpm, acc} = updateStats(typed, errors);
      if(typed.length >= target.length){
        finished = true; inputEl.disabled = true;
        const rateWrap = body.querySelector('#typingRateWrap');
        rateWrap.innerHTML = `<button class="zbtn zbtn-accent" style="width:100%; margin-top:10px;" id="typingSave">Save score: ${acc}% accuracy · ${wpm} WPM</button>`;
        rateWrap.querySelector('#typingSave').addEventListener('click', ()=>zSavePassageScore(acc, 'typing', wpm));
      }
    });
    body.querySelector('#typingRestart').addEventListener('click', ()=>{
      startTime=null; finished=false; inputEl.disabled=false; inputEl.value=''; inputEl.focus();
      renderDisplay('');
      statsEl.textContent = `0 WPM · 100% accuracy · 0 / ${target.length} characters`;
      body.querySelector('#typingRateWrap').innerHTML = '';
    });
  });
}

/* ---- passage reader (plain read mode) ---- */
function zOpenPassageReader(id){
  zFolderItems('ps_passages', zStudyState.folderId).then(all=>{
    const p = all.find(x=>x.id===id);
    const fs = parseInt(localStorage.getItem('zenith_fontsize')||'16', 10);
    zOpenModal(p.title, `
      <div class="reader-toolbar">
        <button class="reader-fsbtn" onclick="zAdjustFontSize(-1)">A-</button>
        <button class="reader-fsbtn" onclick="zAdjustFontSize(1)">A+</button>
      </div>
      <div class="reader-text" id="readerText" style="font-size:${fs}px;">${zBidi(p.text)}</div>
    `);
  });
}
function zAdjustFontSize(delta){
  let fs = parseInt(localStorage.getItem('zenith_fontsize')||'16', 10);
  fs = Math.min(26, Math.max(12, fs + delta));
  localStorage.setItem('zenith_fontsize', fs);
  const el = document.getElementById('readerText');
  if(el) el.style.fontSize = fs + 'px';
}

/* ---- flashcard review session (light SM-2) ---- */
let _fcSession = null;
async function zStartFlashcardSession(itemsOverride){
  const items = itemsOverride || await zFolderItems('fc_cards', zStudyState.folderId);
  const today = zLocalISODate();
  let due = items.filter(c=>!c.dueDate || c.dueDate <= today);
  if(!due.length){
    if(!items.length){ zToast('No cards here yet.'); return; }
    if(!confirm('No cards due right now. Study the whole set anyway?')) return;
    due = items.slice();
  }
  _fcSession = { queue: zShuffle(due), idx:0, total: due.length, flipped:false };
  zRenderFcSession();
}
function zRenderFcSession(){
  const s = _fcSession;
  if(s.idx >= s.queue.length){
    zOpenModal('Session complete', `
      <div class="zempty"><div class="ph-icon">✓</div><p>${s.total} card${s.total===1?'':'s'} reviewed.</p></div>
      <button class="zbtn zbtn-accent" style="width:100%" onclick="zCloseModal(); zRenderStudy();">Done</button>
    `);
    return;
  }
  const card = s.queue[s.idx];
  const faceText = s.flipped ? card.back : card.front;
  const faceImg = s.flipped ? card.backImage : card.frontImage;
  const faceLayout = s.flipped ? card.backImageLayout : card.frontImageLayout;
  zOpenModal(null, `
    <div class="session-wrap">
      <div class="session-progress">${s.idx+1} / ${s.total}</div>
      <div class="flip-card ${zFaceClass(faceText, faceImg, faceLayout)}" id="flipCard" onclick="zFlipFcCard()">${zRenderFace(faceText, faceImg, faceLayout)}</div>
      ${s.flipped ? `
        <div class="grade-row">
          <button class="grade-btn grade-again" onclick="zGradeCard('again')">Again</button>
          <button class="grade-btn" onclick="zGradeCard('hard')">Hard</button>
          <button class="grade-btn grade-good" onclick="zGradeCard('good')">Good</button>
          <button class="grade-btn grade-good" onclick="zGradeCard('easy')">Easy</button>
        </div>` : `<p style="text-align:center; color:var(--text-muted); font-size:12.5px;">Tap the card to reveal the answer</p>`}
    </div>
  `);
}
function zFlipFcCard(){ _fcSession.flipped = true; zRenderFcSession(); }
async function zGradeCard(grade){
  const s = _fcSession;
  const card = s.queue[s.idx];
  const today = new Date();
  let interval = card.interval || 0, ease = card.ease || 2.5;
  if(grade === 'again'){
    ease = Math.max(1.3, ease - 0.2); interval = 1; card.lapses = (card.lapses||0) + 1;
    card.isLeech = card.lapses >= 8;
  } else if(grade === 'hard'){
    ease = Math.max(1.3, ease - 0.05); interval = Math.max(1, Math.round((interval||1) * 1.2));
  } else if(grade === 'good'){
    interval = interval ? Math.round(interval * ease) : 1;
  } else {
    ease = ease + 0.1; interval = Math.round((interval || 1) * ease * 1.3) + 1;
  }
  card.ease = ease; card.interval = interval; card.reps = (card.reps||0) + 1; card.lastResult = grade;
  const due = new Date(today); due.setDate(due.getDate() + interval);
  card.dueDate = zLocalISODate(due);
  await zPut('fc_cards', card);
  s.idx++; s.flipped = false;
  zRenderFcSession();
}

/* ---- quiz practice session ---- */
let _qzSession = null;
let _qzPendingItemsFn = null;
function zStartQuizSession(){
  _qzPendingItemsFn = () => zFolderItems('qz_quizzes', zStudyState.folderId);
  zOpenQuizSettingsModal();
}
function zStartQuizSessionGoWithItems(items){
  _qzPendingItemsFn = () => Promise.resolve(items);
  zOpenQuizSettingsModal();
}
function zOpenQuizSettingsModal(){
  zOpenModal('Practice settings', `
    <div class="toggle-setting-row">
      <label>Timer</label>
      <label class="zswitch"><input type="checkbox" id="qzTimerToggle"><span class="zslider"></span></label>
    </div>
    <div class="toggle-setting-row" id="qzTimerMinsRow" style="display:none;">
      <label>Minutes</label>
      <input type="number" id="qzTimerMins" value="10" min="1">
    </div>
    <div class="toggle-setting-row">
      <label>Pass threshold</label>
      <label class="zswitch"><input type="checkbox" id="qzPassToggle"><span class="zslider"></span></label>
    </div>
    <div class="toggle-setting-row" id="qzPassPctRow" style="display:none;">
      <label>Pass %</label>
      <input type="number" id="qzPassPct" value="70" min="1" max="100">
    </div>
    <div class="zform-actions"><button class="zbtn zbtn-accent" style="flex:1" onclick="zStartQuizSessionGo()">Start</button></div>
  `, (body)=>{
    body.querySelector('#qzTimerToggle').addEventListener('change', (e)=>{
      body.querySelector('#qzTimerMinsRow').style.display = e.target.checked ? 'flex' : 'none';
    });
    body.querySelector('#qzPassToggle').addEventListener('change', (e)=>{
      body.querySelector('#qzPassPctRow').style.display = e.target.checked ? 'flex' : 'none';
    });
  });
}
async function zStartQuizSessionGo(){
  const timerOn = document.getElementById('qzTimerToggle').checked;
  const timerSec = timerOn ? (Number(document.getElementById('qzTimerMins').value) || 10) * 60 : null;
  const passOn = document.getElementById('qzPassToggle').checked;
  const passPct = passOn ? Math.min(100, Math.max(1, Number(document.getElementById('qzPassPct').value) || 70)) : null;

  const items = await _qzPendingItemsFn();
  if(!items.length){ zToast('No questions here yet.'); return; }
  _qzSession = { queue: zShuffle(items.slice()), idx:0, total: items.length, correctCount:0, answered:false, timerSec, timerRemaining:timerSec, passPct, timerHandle:null, timedOut:false };
  zRenderQzSession();
  if(timerSec){
    _qzSession.timerHandle = setInterval(()=>{
      if(!_qzSession) return;
      _qzSession.timerRemaining--;
      const badge = document.getElementById('qzTimerBadge');
      if(badge) badge.textContent = zFmtTimer(_qzSession.timerRemaining);
      if(_qzSession.timerRemaining <= 0){
        clearInterval(_qzSession.timerHandle);
        _qzSession.timedOut = true;
        _qzSession.idx = _qzSession.queue.length;
        zRenderQzSession();
      }
    }, 1000);
  }
}
function zFmtTimer(sec){
  sec = Math.max(0, sec);
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function zRenderQzSession(){
  const s = _qzSession;
  if(s.idx >= s.queue.length){
    if(s.timerHandle) clearInterval(s.timerHandle);
    const pct = s.total ? Math.round((s.correctCount/s.total)*100) : 0;
    const passLine = s.passPct != null
      ? `<div style="margin-top:6px; font-weight:700; color:${pct>=s.passPct?'var(--success)':'var(--danger)'}">${pct>=s.passPct?'Passed':'Below threshold'} (need ${s.passPct}%)</div>`
      : '';
    zOpenModal('Session complete', `
      <div class="zempty"><div class="ph-icon">✓</div>
        <p>${s.correctCount} / ${s.total} correct (${pct}%)</p>
        ${s.timedOut ? '<p style="color:var(--danger); font-size:12px;">Time\'s up — session ended early.</p>' : ''}
        ${passLine}
      </div>
      <button class="zbtn zbtn-accent" style="width:100%" onclick="zCloseModal(); zRenderStudy();">Done</button>
    `);
    return;
  }
  const q = s.queue[s.idx];
  zOpenModal(null, `
    <div class="session-wrap">
      <div class="session-progress">${s.idx+1} / ${s.total}</div>
      ${s.timerSec ? `<div class="qz-timer-badge" id="qzTimerBadge">${zFmtTimer(s.timerRemaining)}</div>` : ''}
      <div class="qz-question">${zBidi(q.question)}</div>
      <div id="qzOpts">
        ${q.options.map((o,i)=>`<button class="qz-opt" onclick="zAnswerQuiz(${i})">${zBidi(o.text)}</button>`).join('')}
      </div>
      <div id="qzNextWrap"></div>
    </div>
  `);
}
async function zAnswerQuiz(i){
  const s = _qzSession;
  if(s.answered) return;
  s.answered = true;
  const q = s.queue[s.idx];
  const btns = [...document.querySelectorAll('#qzOpts .qz-opt')];
  btns.forEach((b,idx)=>{
    b.disabled = true;
    if(q.options[idx].correct) b.classList.add('correct');
    else if(idx === i) b.classList.add('wrong');
  });
  const wasCorrect = q.options[i].correct;
  if(wasCorrect) s.correctCount++;
  q.lastResult = wasCorrect ? 'correct' : 'incorrect';
  q.reps = (q.reps||0) + 1;
  await zPut('qz_quizzes', q);
  const nextWrap = document.getElementById('qzNextWrap');
  nextWrap.innerHTML = `
    ${q.explanation ? `<div class="qz-explanation"><b>Explanation:</b> ${zBidi(q.explanation)}</div>` : ''}
    <button class="zbtn zbtn-accent" style="width:100%; margin-top:14px;" onclick="zNextQuiz()">Next</button>
  `;
}
function zNextQuiz(){
  _qzSession.idx++; _qzSession.answered = false;
  zRenderQzSession();
}

const TAB_TITLES = {
  dashboard:'Dashboard', study:'Study', habits:'Habits',
  library:'Library', courses:'Courses'
};
function zSwitchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tabview').forEach(v=>v.classList.toggle('active', v.dataset.view === tab));
  document.getElementById('zTitle').textContent = TAB_TITLES[tab] || '';
  document.getElementById('zmain').scrollTop = 0;
  document.getElementById('studyFab').style.display = 'none';
  if(tab === 'dashboard') zRenderDashboard();
  else if(tab === 'study') zRenderStudy();
  else if(tab === 'habits') zRenderHabits();
  else if(tab === 'library') zRenderLibrary();
  else if(tab === 'courses') zRenderCourses();
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>zSwitchTab(btn.dataset.tab));
});
