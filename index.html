<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0F1626">
<title>Zenith</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ROOT TOKENS
   ============================================================ */
:root{
  --nav-h: 64px;
  --header-h: 52px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --font-display: 'Fraunces', 'IBM Plex Sans Arabic', serif;
  --font-body: 'Inter', 'IBM Plex Sans Arabic', -apple-system, sans-serif;
  --font-ar: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
}

/* ===== THEME TOKENS ===== */
/* summit — derived from the Zenith mark: crimson + navy + cream. Default theme. */
html[data-theme="summit"][data-mode="dark"]{
  --bg:#0F1626; --surface:#16203A; --surface-2:#1D2B4D; --border:#2A3B5C;
  --text:#F3ECDD; --text-muted:#9AA4BE; --accent:#C43E4A; --accent-2:#E0985A;
  --success:#5FAF82; --danger:#D97A3F; --accent-contrast:#FFF8F0;
}
html[data-theme="summit"][data-mode="light"]{
  --bg:#FBF6EA; --surface:#FFFFFF; --surface-2:#F0E6D0; --border:#E2D3B0;
  --text:#1B2A4A; --text-muted:#5C6A8C; --accent:#A8283A; --accent-2:#22335C;
  --success:#3F8A5C; --danger:#B8541F; --accent-contrast:#FFF8F0;
}

html[data-theme="expedition-peak"][data-mode="dark"]{
  --bg:#14151A; --surface:#1C1E26; --surface-2:#242732; --border:#2E313D;
  --text:#F5F1E8; --text-muted:#9C9584; --accent:#D4A24C; --accent-2:#F0C878;
  --success:#7FB88A; --danger:#D97E6B; --accent-contrast:#1B140A;
}
html[data-theme="expedition-peak"][data-mode="light"]{
  --bg:#F7F3EA; --surface:#FFFFFF; --surface-2:#EFE8D8; --border:#E3DAC4;
  --text:#2B2416; --text-muted:#756B58; --accent:#B8862F; --accent-2:#8C6A24;
  --success:#4C8A5C; --danger:#B8543C; --accent-contrast:#FFFCF5;
}

html[data-theme="observatory"][data-mode="dark"]{
  --bg:#0B1120; --surface:#131B2E; --surface-2:#1A2338; --border:#22304A;
  --text:#E4E9F5; --text-muted:#8B99B8; --accent:#5EA8FF; --accent-2:#2DD4BF;
  --success:#3FBF8F; --danger:#E0667A; --accent-contrast:#06101F;
}
html[data-theme="observatory"][data-mode="light"]{
  --bg:#F5F7FB; --surface:#FFFFFF; --surface-2:#EAEFF9; --border:#D7E0F0;
  --text:#10182B; --text-muted:#5B6B8C; --accent:#2B5FCC; --accent-2:#0E9488;
  --success:#0E8F5E; --danger:#C43F55; --accent-contrast:#F5F9FF;
}

html[data-theme="silent-cosmos"][data-mode="dark"]{
  --bg:#0A0A0C; --surface:#131316; --surface-2:#19191D; --border:#232327;
  --text:#E8E8EA; --text-muted:#77767F; --accent:#9C8FC7; --accent-2:#6B6B7A;
  --success:#7FA88F; --danger:#B87F7F; --accent-contrast:#101014;
}
html[data-theme="silent-cosmos"][data-mode="light"]{
  --bg:#F2F2F4; --surface:#FAFAFA; --surface-2:#ECECEF; --border:#DEDEE2;
  --text:#232326; --text-muted:#7A7982; --accent:#7A6FA0; --accent-2:#55535E;
  --success:#4F8069; --danger:#9C5C5C; --accent-contrast:#FAFAFA;
}

html[data-theme="nebula-glow"][data-mode="dark"]{
  --bg:#000000; --surface:#0D0620; --surface-2:#12092B; --border:#241535;
  --text:#F5F0FF; --text-muted:#A79BC4; --accent:#D946EF; --accent-2:#7C3AED;
  --success:#3FD6A0; --danger:#FF5D8F; --accent-contrast:#180A22;
}
html[data-theme="nebula-glow"][data-mode="light"]{
  --bg:#FAF5FF; --surface:#FFFFFF; --surface-2:#F3E8FF; --border:#E9D5FF;
  --text:#1E1033; --text-muted:#6B5B85; --accent:#A21CAF; --accent-2:#6D28D9;
  --success:#0F9D69; --danger:#D6336C; --accent-contrast:#FDF7FF;
}

html[data-theme="lunar-monochrome"][data-mode="dark"]{
  --bg:#18181B; --surface:#202023; --surface-2:#27272A; --border:#3F3F46;
  --text:#FAFAFA; --text-muted:#A1A1AA; --accent:#FAFAFA; --accent-2:#A1A1AA;
  --success:#7FBF9C; --danger:#D97C7C; --accent-contrast:#18181B;
}
html[data-theme="lunar-monochrome"][data-mode="light"]{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface-2:#F4F4F5; --border:#E4E4E7;
  --text:#18181B; --text-muted:#71717A; --accent:#18181B; --accent-2:#52525B;
  --success:#2F8F5C; --danger:#B5473F; --accent-contrast:#FAFAFA;
}

html[data-theme="forest-study"][data-mode="dark"]{
  --bg:#10160F; --surface:#181F16; --surface-2:#20281C; --border:#2C3626;
  --text:#EAF0E5; --text-muted:#93A08C; --accent:#6FAF6E; --accent-2:#9BCB82;
  --success:#6FAF6E; --danger:#D97E6B; --accent-contrast:#0B1409;
}
html[data-theme="forest-study"][data-mode="light"]{
  --bg:#F3F6EF; --surface:#FFFFFF; --surface-2:#E9EFE1; --border:#D6E0C9;
  --text:#1B2417; --text-muted:#5E6B55; --accent:#3F7A3E; --accent-2:#6B9A4F;
  --success:#3F7A3E; --danger:#B8543C; --accent-contrast:#F7FBF3;
}

html[data-theme="sunset-desk"][data-mode="dark"]{
  --bg:#1A120D; --surface:#241811; --surface-2:#2E1F15; --border:#3D2A1C;
  --text:#F7EBE1; --text-muted:#B39A85; --accent:#E28449; --accent-2:#F0B074;
  --success:#7FB88A; --danger:#E0667A; --accent-contrast:#1A0D04;
}
html[data-theme="sunset-desk"][data-mode="light"]{
  --bg:#FBF1E7; --surface:#FFFFFF; --surface-2:#F5E6D5; --border:#E9D2B6;
  --text:#2E1A0E; --text-muted:#7A5C46; --accent:#B8571F; --accent-2:#C4632B;
  --success:#4C8A5C; --danger:#C43F55; --accent-contrast:#FFF9F2;
}

html[data-theme="arctic-focus"][data-mode="dark"]{
  --bg:#0C1418; --surface:#131E23; --surface-2:#1A272D; --border:#24343B;
  --text:#E6F2F5; --text-muted:#8FA8AF; --accent:#5FCBE0; --accent-2:#8FE0D0;
  --success:#3FBF8F; --danger:#E0667A; --accent-contrast:#04191E;
}
html[data-theme="arctic-focus"][data-mode="light"]{
  --bg:#EFF7F9; --surface:#FFFFFF; --surface-2:#E1F0F3; --border:#C9E3E8;
  --text:#0F2529; --text-muted:#4C6E75; --accent:#0E7C93; --accent-2:#0E9488;
  --success:#0E8F5E; --danger:#C43F55; --accent-contrast:#F5FCFD;
}

html[data-theme="rosewood"][data-mode="dark"]{
  --bg:#170F12; --surface:#211519; --surface-2:#2B1A20; --border:#3A2129;
  --text:#F3E4E7; --text-muted:#A98A90; --accent:#D97E93; --accent-2:#E8A5B5;
  --success:#7FB88A; --danger:#D97E6B; --accent-contrast:#1D0F13;
}
html[data-theme="rosewood"][data-mode="light"]{
  --bg:#FBF0F1; --surface:#FFFFFF; --surface-2:#F5E1E4; --border:#E8C7CD;
  --text:#2B1418; --text-muted:#7C5B60; --accent:#A8425A; --accent-2:#8C4A57;
  --success:#4C8A5C; --danger:#B8543C; --accent-contrast:#FFF7F8;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overscroll-behavior:none; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:15px; line-height:1.5;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,.display{ font-family:var(--font-display); font-weight:600; letter-spacing:-.01em; margin:0; }
button{ font-family:inherit; }
a{ color:inherit; }

/* Bidi isolation: any Latin/number/math run embedded inside Arabic text gets
   wrapped in this span so its internal order stays LTR without flipping the
   surrounding Arabic line. See zBidi() in the shared script block. */
.bidi-embed{ unicode-bidi:isolate; direction:ltr; display:inline-block; }
[dir="rtl"], .rtl-text{ direction:rtl; unicode-bidi:plaintext; font-family:var(--font-ar); text-align:right; }

/* ============================================================
   SPLASH SCREEN — the logo itself, drawn as SVG (no raster asset)
   ============================================================ */
#splash{
  position:fixed; inset:0; z-index:999;
  background:#0F1626;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  transition:opacity .5s ease, visibility .5s ease;
}
#splash.hide{ opacity:0; visibility:hidden; pointer-events:none; }
#splash svg{ width:132px; height:auto; }
#splash .peak-fill{ animation: peakRise 900ms cubic-bezier(.22,1,.36,1) 150ms both; transform-origin:center bottom; }
#splash .shield-outline{ stroke-dasharray:400; stroke-dashoffset:400; animation: drawShield 900ms ease-out both; }
#splash .word{
  margin-top:16px; font-family:var(--font-display); font-weight:600; font-size:22px;
  letter-spacing:.14em; color:#F3ECDD;
  opacity:0; animation: fadeUp 500ms ease-out 700ms both;
}
#splash .tag{
  margin-top:5px; font-family:var(--font-body); font-weight:600; font-size:10.5px;
  letter-spacing:.32em; color:#C43E4A;
  opacity:0; animation: fadeUp 500ms ease-out 850ms both;
}
@keyframes drawShield{ to{ stroke-dashoffset:0; } }
@keyframes peakRise{ from{ opacity:0; transform:translateY(10px) scale(.92); } to{ opacity:1; transform:translateY(0) scale(1); } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }

/* ============================================================
   APP SHELL
   ============================================================ */
#app{ display:none; height:100%; flex-direction:column; }
#app.ready{ display:flex; }

.zheader{
  height:calc(var(--header-h) + var(--safe-top));
  padding-top:var(--safe-top);
  display:flex; align-items:center; justify-content:space-between;
  padding-left:18px; padding-right:14px;
  border-bottom:1px solid var(--border);
  background:var(--surface); flex:0 0 auto;
}
.zheader h1{ font-size:18px; }
.zheader .hicons{ display:flex; gap:6px; }
.hicon-btn{
  width:36px; height:36px; border-radius:var(--radius-sm); border:1px solid transparent;
  background:transparent; color:var(--text-muted); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .15s, color .15s;
}
.hicon-btn:active{ background:var(--surface-2); color:var(--text); }
.hicon-btn svg{ width:19px; height:19px; }

#zmain{
  flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 16px calc(var(--nav-h) + var(--safe-bottom) + 20px) 16px;
}

.tabview{ display:none; animation:fadeUp 220ms ease-out both; }
.tabview.active{ display:block; }

.zplaceholder{
  border:1.5px dashed var(--border); border-radius:var(--radius-lg);
  padding:40px 20px; text-align:center; color:var(--text-muted);
}
.zplaceholder .ph-icon{ font-size:34px; margin-bottom:10px; }
.zplaceholder h2{ font-size:16px; color:var(--text); margin-bottom:6px; }
.zplaceholder p{ font-size:13.5px; max-width:280px; margin:0 auto; }

/* ===== Bottom tab bar ===== */
#tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  height:calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom:var(--safe-bottom);
  background:var(--surface); border-top:1px solid var(--border);
  display:flex;
}
.tab-btn{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; background:none; border:none; color:var(--text-muted); cursor:pointer;
  font-size:10.5px; font-weight:600; letter-spacing:.01em; padding:6px 0 4px;
}
.tab-btn svg{ width:22px; height:22px; }
.tab-btn.active{ color:var(--accent); }
.tab-btn .tdot{
  width:4px; height:4px; border-radius:50%; background:var(--accent);
  margin-top:1px; opacity:0; transform:scale(.5); transition:opacity .15s, transform .15s;
}
.tab-btn.active .tdot{ opacity:1; transform:scale(1); }

/* ===== Shared: cards, buttons ===== */
.zcard{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px;
}
.zbtn{
  border-radius:var(--radius-sm); padding:10px 16px; font-size:13.5px; font-weight:600;
  border:1px solid var(--border); background:var(--surface-2); color:var(--text); cursor:pointer;
}
.zbtn-accent{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
.zbtn-ghost{ background:none; }

/* ===== Shared modal system (used by every module — one implementation) ===== */
#modalBackdrop{
  position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.5);
  display:flex; align-items:flex-end; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
#modalBackdrop.show{ opacity:1; pointer-events:auto; }
#modalBackdrop .zmodal{
  width:100%; max-width:480px; max-height:86vh; overflow-y:auto;
  background:var(--surface); border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  padding:20px 18px calc(20px + var(--safe-bottom));
  transform:translateY(16px); transition:transform .22s cubic-bezier(.22,1,.36,1);
}
#modalBackdrop.show .zmodal{ transform:translateY(0); }
.zmodal h3{ font-size:16px; margin-bottom:14px; }
.zmodal-close{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
  border:none; background:var(--surface-2); color:var(--text-muted); cursor:pointer; font-size:15px;
}

/* ===== Theme picker grid (Settings) ===== */
.theme-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
.theme-swatch{
  border-radius:var(--radius-sm); border:1.5px solid var(--border); padding:10px; cursor:pointer;
  display:flex; align-items:center; gap:8px; background:var(--surface-2);
}
.theme-swatch.selected{ border-color:var(--accent); }
.swatch-dot{ width:20px; height:20px; border-radius:50%; flex:0 0 auto; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25); }
.swatch-name{ font-size:12px; font-weight:600; }
.mode-toggle{ display:flex; gap:6px; margin-top:14px; }
.mode-btn{
  flex:1; padding:9px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface-2); color:var(--text-muted); font-size:13px; font-weight:600; cursor:pointer;
}
.mode-btn.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }

.zsection-title{ font-size:11.5px; font-weight:700; letter-spacing:.06em; color:var(--text-muted); margin:22px 0 8px; }
.zsection-title:first-child{ margin-top:0; }

/* ============================================================
   STUDY MODULE — sub-tabs, breadcrumb, folder browser, decks
   ============================================================ */
.study-subtabs{ display:flex; gap:6px; margin-bottom:14px; }
.study-subtab{
  flex:1; padding:9px 4px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text-muted); font-size:12.5px; font-weight:600; cursor:pointer;
}
.study-subtab.active{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }

.crumbbar{
  display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin-bottom:12px;
  font-size:12.5px; color:var(--text-muted);
}
.crumb{ cursor:pointer; padding:3px 2px; }
.crumb.current{ color:var(--text); font-weight:600; cursor:default; }
.crumb-sep{ color:var(--border); }

.study-toolbar{ display:flex; gap:8px; margin-bottom:14px; }
.study-toolbar .zbtn{ flex:1; font-size:12.5px; padding:9px 8px; }

.folder-list{ display:flex; flex-direction:column; gap:8px; }
.folder-row{
  display:flex; align-items:center; gap:10px; padding:13px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  cursor:pointer;
}
.folder-row .ficon{ font-size:18px; flex:0 0 auto; color:var(--accent); }
.folder-row .finfo{ flex:1; min-width:0; }
.folder-row .fname{ font-size:14px; font-weight:600; unicode-bidi:plaintext; }
.folder-row .fmeta{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
.folder-row .fmore{ color:var(--text-muted); padding:4px; }

.item-row{
  display:flex; align-items:flex-start; gap:10px; padding:13px 14px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  margin-bottom:8px;
}
.item-row .ibody{ flex:1; min-width:0; unicode-bidi:plaintext; }
.item-row .ifront{ font-size:14px; font-weight:600; }
.item-row .iback{ font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.item-row .itags{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.tag-pill{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px; background:var(--surface-2); color:var(--text-muted); }
.tag-pill.leech{ background:rgba(217,122,63,.18); color:var(--danger); }
.tag-pill.due{ background:rgba(196,62,74,.16); color:var(--accent); }
.item-actions{ display:flex; gap:4px; flex:0 0 auto; }
.item-actions button{ background:none; border:none; color:var(--text-muted); font-size:15px; cursor:pointer; padding:4px; }

.fab{
  position:fixed; right:calc(18px + var(--safe-right)); bottom:calc(var(--nav-h) + var(--safe-bottom) + 18px);
  width:52px; height:52px; border-radius:50%; background:var(--accent); color:var(--accent-contrast);
  border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.28); cursor:pointer; z-index:30;
}

.zempty{ text-align:center; padding:44px 16px; color:var(--text-muted); }
.zempty .ph-icon{ font-size:30px; margin-bottom:8px; }
.zempty p{ font-size:13px; margin:0; }

.zform-field{ margin-bottom:12px; }
.zform-field label{ display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px; }
.zform-field input, .zform-field textarea, .zform-field select{
  width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:10px 12px; font-size:14px; font-family:inherit; unicode-bidi:plaintext;
}
.zform-field textarea{ min-height:80px; resize:vertical; }
.zform-actions{ display:flex; gap:8px; margin-top:16px; }
.zform-actions .zbtn{ flex:1; }
.quiz-opt-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.quiz-opt-row input[type="text"]{ flex:1; }
.quiz-opt-row input[type="radio"]{ flex:0 0 auto; width:18px; height:18px; }

/* ---- review / practice sessions ---- */
.session-wrap{ display:flex; flex-direction:column; min-height:60vh; }
.session-progress{ font-size:12px; color:var(--text-muted); margin-bottom:14px; text-align:center; }
.flip-card{
  flex:1; min-height:220px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  display:flex; align-items:center; justify-content:center; padding:26px; text-align:center;
  font-size:17px; font-weight:600; cursor:pointer; unicode-bidi:plaintext; margin-bottom:16px;
}
.flip-card .side-label{ position:absolute; margin-top:-160px; font-size:10.5px; letter-spacing:.1em; color:var(--text-muted); font-weight:700; }
.grade-row{ display:flex; gap:8px; }
.grade-btn{
  flex:1; padding:13px 4px; border-radius:var(--radius-md); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:12.5px; font-weight:700; cursor:pointer;
  display:flex; flex-direction:column; gap:2px; align-items:center;
}
.grade-btn .gint{ font-size:10px; color:var(--text-muted); font-weight:600; }
.grade-again{ border-color:var(--danger); color:var(--danger); }
.grade-good{ border-color:var(--accent); color:var(--accent); }

.qz-question{ font-size:16px; font-weight:600; margin-bottom:18px; unicode-bidi:plaintext; }
.qz-opt{
  display:block; width:100%; text-align:start; padding:13px 14px; margin-bottom:9px;
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md);
  color:var(--text); font-size:14px; cursor:pointer; unicode-bidi:plaintext;
}
.qz-opt.correct{ border-color:var(--success); background:rgba(95,175,130,.12); }
.qz-opt.wrong{ border-color:var(--danger); background:rgba(217,122,63,.12); }
.qz-opt[disabled]{ pointer-events:none; }
.qz-explanation{
  margin-top:12px; padding:12px 14px; border-radius:var(--radius-md);
  background:var(--surface-2); border:1px solid var(--border); font-size:13px; line-height:1.6; unicode-bidi:plaintext;
}

/* ============================================================
   LIBRARY MODULE
   ============================================================ */
.lib-search{
  width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:var(--radius-sm); padding:11px 14px; font-size:14px; font-family:inherit; margin-bottom:16px;
}
.lib-row{ margin-bottom:22px; }
.lib-row-title{ font-size:13px; font-weight:700; margin-bottom:10px; }
.lib-scroll{ display:flex; gap:12px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
.lib-scroll::-webkit-scrollbar{ display:none; }
.book-cover-item{ flex:0 0 auto; width:98px; cursor:pointer; }
.book-cover-art{
  width:98px; height:140px; border-radius:10px; overflow:hidden; background:var(--surface-2);
  border:1px solid var(--border); position:relative; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
.book-cover-art img{ width:100%; height:100%; object-fit:cover; }
.book-cover-placeholder{ font-size:11px; font-weight:700; text-align:center; padding:8px; color:var(--text-muted); line-height:1.3; unicode-bidi:plaintext; }
.book-cover-title{
  font-size:11.5px; font-weight:600; margin-top:6px; line-height:1.3; unicode-bidi:plaintext;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  min-height:30px;
}
.book-cover-progress{ height:3px; background:var(--border); border-radius:2px; margin-top:5px; overflow:hidden; }
.book-cover-progress-fill{ height:100%; background:var(--accent); }
.pin-badge{ position:absolute; top:5px; right:5px; font-size:12px; }

.book-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; }
.book-grid .book-cover-item{ width:auto; }
.book-grid .book-cover-art{ width:100%; height:0; padding-bottom:143%; }
.book-grid .book-cover-art img, .book-grid .book-cover-art .book-cover-placeholder{ position:absolute; inset:0; }

.book-detail-cover{ width:140px; height:200px; margin:0 auto 16px; border-radius:12px; overflow:hidden; background:var(--surface-2); border:1px solid var(--border); box-shadow:0 6px 18px rgba(0,0,0,.22); position:relative; }
.book-detail-cover img{ width:100%; height:100%; object-fit:cover; }
.book-progress-bar{ height:8px; background:var(--surface-2); border-radius:20px; overflow:hidden; margin:12px 0 6px; }
.book-progress-fill{ height:100%; background:var(--accent); }
.book-progress-label{ text-align:center; font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }

/* ============================================================
   COURSES
   ============================================================ */
.course-video-grid{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.course-video-chip{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; cursor:pointer;
}
.course-video-chip.done{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
.mode-select-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
.mode-select-card{
  border-radius:var(--radius-sm); border:1.5px solid var(--border); padding:12px; cursor:pointer; background:var(--surface-2);
}
.mode-select-card.selected{ border-color:var(--accent); }
.mode-select-card b{ display:block; font-size:13px; margin-bottom:2px; }
.mode-select-card span{ font-size:11px; color:var(--text-muted); }

/* ============================================================
   DASHBOARD / INSIGHTS
   ============================================================ */
.ring-row{ display:flex; gap:24px; justify-content:center; margin:6px 0 22px; }
.ring-item{ text-align:center; }
.ring-label{ font-size:11.5px; color:var(--text-muted); margin-top:6px; font-weight:600; }
.dash-due-card{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; cursor:pointer; }
.dash-due-num{ font-size:26px; font-weight:700; }
.dash-due-sub{ font-size:11.5px; color:var(--text-muted); }
.streak-strip{ display:flex; gap:6px; margin-bottom:22px; }
.streak-cell{ flex:1; height:30px; border-radius:7px; background:var(--accent); }
.streak-cell-label{ text-align:center; font-size:9.5px; color:var(--text-muted); margin-top:4px; }
.streak-col{ flex:1; display:flex; flex-direction:column; align-items:center; }
.dash-course-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.dash-course-name{ flex:0 0 96px; font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; unicode-bidi:plaintext; }
.dash-course-bar{ flex:1; height:7px; background:var(--surface-2); border-radius:8px; overflow:hidden; }
.dash-course-fill{ height:100%; background:var(--accent); }
.dash-course-pct{ flex:0 0 32px; font-size:11px; color:var(--text-muted); text-align:right; }
.insights-section{ margin-bottom:26px; }
.insights-section-title{ font-size:13px; font-weight:700; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; }
.insights-stat-row{ display:flex; gap:10px; margin-bottom:14px; }
.insights-stat{ flex:1; background:var(--surface-2); border-radius:var(--radius-sm); padding:10px; text-align:center; }
.insights-stat b{ display:block; font-size:18px; }
.insights-stat span{ font-size:10.5px; color:var(--text-muted); }
.insights-list-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; unicode-bidi:plaintext; }
.insights-list-row:last-child{ border-bottom:none; }
.insights-list-row span{ font-size:13px; }
.insights-list-row .chev{ color:var(--text-muted); }

.reader-toolbar{ display:flex; justify-content:flex-end; gap:6px; margin-bottom:12px; }
.reader-fsbtn{
  width:34px; height:34px; border-radius:var(--radius-sm); border:1px solid var(--border);
  background:var(--surface); color:var(--text); font-size:15px; cursor:pointer;
}
.reader-text{ unicode-bidi:plaintext; line-height:1.9; white-space:pre-wrap; }

.import-hint{ font-size:12px; color:var(--text-muted); margin-top:10px; line-height:1.6; }

/* ============================================================
   FLASHCARD IMAGES (front/back optional image + layout)
   ============================================================ */
.img-field-wrap{ margin-top:8px; }
.img-upload-btn{
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; padding:10px; border-radius:var(--radius-sm); border:1px dashed var(--border);
  background:var(--surface-2); color:var(--text-muted); font-size:12.5px; font-family:inherit; cursor:pointer;
}
.img-upload-btn svg{ width:15px; height:15px; }
.img-preview{ position:relative; margin-top:8px; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--border); background:var(--surface-2); }
.img-preview img{ display:block; width:100%; max-height:160px; object-fit:contain; background:var(--surface-2); }
.img-preview-remove{
  position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%;
  background:rgba(0,0,0,.6); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:14px; line-height:1;
}
.layout-toggle-row{ display:flex; gap:6px; margin-top:8px; }
.layout-toggle-row button{
  flex:1; padding:7px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2);
  color:var(--text-muted); font-size:11.5px; font-family:inherit; cursor:pointer;
}
.layout-toggle-row button.active{ color:var(--accent); border-color:var(--accent); }
.row-thumb{ width:38px; height:38px; border-radius:8px; object-fit:cover; flex-shrink:0; border:1px solid var(--border); background:var(--surface-2); margin-inline-end:4px; }

.flip-card.has-image{ padding:0; overflow:hidden; position:relative; }
.flip-card.img-only .face-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; border-radius:var(--radius-lg); }
.flip-card.img-below{ flex-direction:column; padding:0; }
.flip-card.img-below .face-img-wrap{ width:100%; height:58%; flex-shrink:0; overflow:hidden; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--surface-2); position:relative; }
.flip-card.img-below .face-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.flip-card.img-below .face-text{ flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:14px 18px; overflow-y:auto; }
.flip-card.img-caption{ display:block; padding:0; position:relative; }
.flip-card.img-caption .face-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; border-radius:var(--radius-lg); }
.flip-card.img-caption .face-caption{
  position:absolute; left:0; right:0; bottom:0; padding:24px 16px 14px;
  background:linear-gradient(to top, rgba(0,0,0,.82), rgba(0,0,0,.55) 60%, transparent);
  color:#fff; font-size:14.5px; line-height:1.4; border-radius:0 0 var(--radius-lg) var(--radius-lg);
  text-align:center; max-height:70%; overflow-y:auto;

/* ============================================================
   PASSAGES — practice modes (blanks / fading / boxes / typing)
   ============================================================ */
.ps-method-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
.ps-method-btn{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:14px; text-align:left; cursor:pointer; font-family:inherit; width:100%;
}
.ps-method-btn b{ display:block; font-size:14px; margin-bottom:2px; color:var(--text); }
.ps-method-btn span{ font-size:12px; color:var(--text-muted); }

.tok-word{ cursor:pointer; padding:1px 4px; border-radius:5px; }
.tok-word.blanked{ background:var(--accent); color:var(--accent-contrast); }

.blank-input{
  display:inline-block; width:auto; min-width:56px; max-width:120px;
  border:none; border-bottom:2px solid var(--accent); background:transparent;
  color:var(--text); font:inherit; font-size:15px; text-align:center; padding:0 4px; margin:0 2px;
}
.blank-input.correct{ border-color:var(--success); color:var(--success); }
.blank-input.incorrect{ border-color:var(--danger); color:var(--danger); }
.blank-hint{ display:block; font-size:10.5px; color:var(--danger); margin-top:2px; }

.ps-fade-controls{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.ps-fade-controls input[type="range"]{ accent-color:var(--accent); flex:1; min-width:120px; }
.fade-word{ display:inline; }

.ps-typing-display{ font-family:'Courier New', monospace; line-height:1.9; letter-spacing:0.3px; }
.ty-correct{ color:var(--success); }
.ty-incorrect{ color:var(--accent-contrast); background:var(--danger); border-radius:2px; }
.ty-pending{ color:var(--text-muted); }
.ty-cursor{ color:var(--text); background:var(--accent); border-radius:2px; }
.ps-typing-input{ font-family:'Courier New', monospace; margin-top:10px; resize:vertical; width:100%; min-height:90px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:var(--radius-sm); padding:10px; }

.tok-box{
  display:inline-block; padding:2px 7px; margin:2px 1px; border-radius:5px;
  background:var(--surface-2); border:1px solid var(--border); cursor:pointer;
  color:transparent; transition:color .2s ease, background .2s ease;
}
.tok-box.revealed{ color:var(--text); background:var(--surface); }

.self-rate-row{ display:flex; gap:8px; margin-top:18px; }
.self-rate-btn{
  flex:1; padding:12px 6px; border-radius:var(--radius-md); border:1.5px solid var(--border);
  background:var(--surface); font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer; color:var(--text);
}
.self-rate-btn.struggled{ border-color:var(--danger); color:var(--danger); }
.self-rate-btn.partial{ border-color:var(--accent-2); color:var(--accent-2); }
.self-rate-btn.recalled{ border-color:var(--success); color:var(--success); }

.session-exit{ background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer; padding:8px 0; margin-bottom:6px; }

/* ============================================================
   QUIZ — timer / pass-threshold toggles
   ============================================================ */
.toggle-setting-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
.toggle-setting-row:last-child{ border-bottom:none; }

.toggle-setting-row input[type="number"]{ width:64px; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; font-size:13px; }
.zswitch{ position:relative; width:40px; height:22px; }
.zswitch input{ opacity:0; width:0; height:0; }
.zswitch .zslider{ position:absolute; inset:0; background:var(--surface-2); border:1px solid var(--border); border-radius:22px; cursor:pointer; transition:.15s; }
.zswitch .zslider:before{ content:''; position:absolute; width:16px; height:16px; left:2px; top:2px; background:var(--text-muted); border-radius:50%; transition:.15s; }
.zswitch input:checked + .zslider{ background:var(--accent); border-color:var(--accent); }
.zswitch input:checked + .zslider:before{ transform:translateX(18px); background:var(--accent-contrast); }
.qz-timer-badge{ font-size:12px; color:var(--text-muted); text-align:center; margin-bottom:8px; }
</style>

<script>
/* ============================================================
   SHARED UTILITIES — one implementation, used by every module.
   This replaces the per-module esc()/openModal()/closeModal()/
   shuffle() copies from the old build.
   ============================================================ */

function zEsc(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

function zShuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* Date.toISOString() converts to UTC before formatting — for anyone
   not in UTC+0, that silently shifts calendar dates by a day (e.g.
   local midnight in UTC+1 becomes "yesterday" in UTC). Every place
   that needs "today's date" or "this date shifted by N days" as a
   string must go through this instead, which reads local calendar
   fields directly. */
function zLocalISODate(d){
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

/* ---- Bidi-safe text rendering ---------------------------------
   Problem this solves: Arabic body text with embedded Latin words,
   numbers, or math (e.g. "البروتين (Protein) x=5") used to reorder
   unpredictably because nothing told the browser which runs were
   LTR. zBidi() walks the string, wraps every contiguous Latin /
   digit / math-symbol run in an isolated LTR span, and leaves the
   Arabic runs alone. Call this anywhere user content is rendered,
   instead of raw zEsc(). ------------------------------------------ */
const Z_RUN_CHARS = /[A-Za-z0-9 .,:;()+\-*/=%^_\[\]{}<>]+/g;
const Z_HAS_ALNUM = /[A-Za-z0-9]/;

function zBidi(str){
  if(str == null) return '';
  const s = String(str);
  const hasArabic = /[\u0600-\u06FF]/.test(s);
  if(!hasArabic) return zEsc(s);

  let out = '';
  let lastIndex = 0;
  let m;
  Z_RUN_CHARS.lastIndex = 0;
  while((m = Z_RUN_CHARS.exec(s))){
    out += zEsc(s.slice(lastIndex, m.index));
    // Only isolate runs that actually contain Latin/digits — a run of
    // just spaces or Arabic-adjacent punctuation doesn't need it, and
    // isolating it anyway would just add noise.
    if(Z_HAS_ALNUM.test(m[0])) out += `<span class="bidi-embed">${zEsc(m[0])}</span>`;
    else out += zEsc(m[0]);
    lastIndex = m.index + m[0].length;
  }
  out += zEsc(s.slice(lastIndex));
  return out;
}

/* ============================================================
   DATA LAYER — IndexedDB
   Six stores: {fc,qz,ps}_folders + {fc,qz,ps}_cards/quizzes/passages.
   A folder is a container (has subfolders) OR a leaf (has items) —
   never both, enforced at creation time, not by a stored flag.
   ============================================================ */
const ZDB_NAME = 'zenith_db';
const ZDB_VERSION = 5;
const ZDB_STORE_DEFS = [
  ['fc_folders', ['parentId']], ['fc_cards', ['folderId']], ['fc_history', ['unitFolderId']],
  ['qz_folders', ['parentId']], ['qz_quizzes', ['folderId']], ['qz_history', ['unitFolderId']],
  ['ps_folders', ['parentId']], ['ps_passages', ['folderId']], ['ps_history', ['passageId']],
  ['habit_defs', []], ['habit_logs', ['date','habitId']],
  ['bk_genres', []], ['bk_books', ['genreId']], ['bk_logs', []],
  ['hb_courses', []],
];
const ZDB_STORES = ZDB_STORE_DEFS.map(d=>d[0]);
let _zdbPromise = null;

function zOpenDB(){
  if(_zdbPromise) return _zdbPromise;
  _zdbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(ZDB_NAME, ZDB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      ZDB_STORE_DEFS.forEach(([name, indexes])=>{
        let os;
        if(!db.objectStoreNames.contains(name)){
          os = db.createObjectStore(name, { keyPath:'id' });
        } else {
          os = e.target.transaction.objectStore(name);
        }
        indexes.forEach(idx=>{
          if(!os.indexNames.contains(idx)) os.createIndex(idx, idx, { unique:false });
        });
      });
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return _zdbPromise;
}
function zNewId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function zGetAll(store, indexName, indexValue){
  const db = await zOpenDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readonly');
    const os = tx.objectStore(store);
    const target = indexName ? os.index(indexName) : os;
    const req = indexName ? target.getAll(indexValue) : target.getAll();
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = ()=>reject(req.error);
  });
}
async function zPut(store, obj){
  const db = await zOpenDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = ()=>resolve(obj);
    tx.onerror = ()=>reject(tx.error);
  });
}
async function zDel(store, id){
  const db = await zOpenDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function zClearStore(store){
  const db = await zOpenDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function zBulkPut(store, items){
  const db = await zOpenDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    const os = tx.objectStore(store);
    items.forEach(it=>os.put(it));
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

/* ---- Folder tree helpers (shared by fc / qz / ps) ----
   IndexedDB rejects `null` as a query key (getAll(null) throws a
   DataError), so top-level folders can't use parentId:null — that
   silently broke every root-level folder lookup. ZROOT is a real,
   valid string key used to mean "no parent". */
const ZROOT = '__root__';
async function zFolderChildren(folderStore, parentId){
  const all = await zGetAll(folderStore, 'parentId', parentId);
  return all.sort((a,b)=>(a.order||0)-(b.order||0));
}
async function zFolderItems(itemStore, folderId){
  const all = await zGetAll(itemStore, 'folderId', folderId);
  return all.sort((a,b)=>(a.order||0)-(b.order||0));
}
async function zFolderIsLeaf(folderStore, itemStore, folderId){
  const items = await zFolderItems(itemStore, folderId);
  if(items.length) return true;
  const subs = await zFolderChildren(folderStore, folderId);
  if(subs.length) return false;
  return null; // empty, undetermined yet
}
async function zCreateFolder(folderStore, parentId, name){
  const siblings = await zFolderChildren(folderStore, parentId);
  const f = { id:zNewId(), parentId, name, order: siblings.length };
  await zPut(folderStore, f);
  return f;
}
/* Resolve (creating as needed) a folder path given as an array of names,
   used by merge-import so an AI-generated deck file can just say where
   it goes by name instead of needing internal IDs. */
async function zResolvePath(folderStore, pathNames){
  let parentId = ZROOT;
  for(const name of pathNames){
    const siblings = await zFolderChildren(folderStore, parentId);
    let match = siblings.find(s=>s.name === name);
    if(!match) match = await zCreateFolder(folderStore, parentId, name);
    parentId = match.id;
  }
  return parentId;
}

/* ============================================================
   IMPORT / MIGRATION
   Three paths:
   1. Legacy full backup (old subject>unit schema)   -> zMigrateLegacy()
   2. New-format full backup (replace everything)     -> zRestoreBackup()
   3. Small deck-only file, additive, by folder path   -> zImportDeck()
   ============================================================ */
async function zMigrateLegacy(oldStores){
  const fcFolderMap = {}, qzFolderMap = {}, psFolderMap = {}, psPassageMap = {};

  for(const s of (oldStores.fc_subjects||[])){
    const f = await zCreateFolder('fc_folders', ZROOT, s.name);
    fcFolderMap['s'+s.id] = f.id;
  }
  for(const u of (oldStores.fc_units||[])){
    const f = await zCreateFolder('fc_folders', fcFolderMap['s'+u.subjectId], u.name);
    fcFolderMap['u'+u.id] = f.id;
  }
  const fcCards = (oldStores.fc_cards||[]).map(c=>({
    id:zNewId(), folderId:fcFolderMap['u'+c.unitId], front:c.front, back:c.back,
    order:c.order||0, interval:c.interval||0, dueDate:c.dueDate||null, reps:c.reps||0,
    lastResult:c.lastResult||null, ease:c.ease||2.5, lapses:c.lapses||0, isLeech:!!c.isLeech
  }));
  await zBulkPut('fc_cards', fcCards);
  const fcHistory = (oldStores.fc_history||[]).filter(h=>fcFolderMap['u'+h.unitId]).map(h=>({
    id:zNewId(), unitFolderId:fcFolderMap['u'+h.unitId], date:h.date, knew:h.knew, total:h.total, hour:h.hour
  }));
  await zBulkPut('fc_history', fcHistory);

  for(const s of (oldStores.qz_subjects||[])){
    const f = await zCreateFolder('qz_folders', ZROOT, s.name);
    qzFolderMap['s'+s.id] = f.id;
  }
  for(const u of (oldStores.qz_units||[])){
    const f = await zCreateFolder('qz_folders', qzFolderMap['s'+u.subjectId], u.name);
    qzFolderMap['u'+u.id] = f.id;
  }
  const qzQuizzes = (oldStores.qz_quizzes||[]).map(q=>({
    id:zNewId(), folderId:qzFolderMap['u'+q.unitId], question:q.question, options:q.options||[],
    explanation:q.explanation||'', order:q.order||0, lastResult:q.lastResult||null, reps:q.reps||0
  }));
  await zBulkPut('qz_quizzes', qzQuizzes);
  const qzHistory = (oldStores.qz_history||[]).filter(h=>qzFolderMap['u'+h.unitId]).map(h=>({
    id:zNewId(), unitFolderId:qzFolderMap['u'+h.unitId], date:h.date, correct:h.correct, total:h.total, hour:h.hour
  }));
  await zBulkPut('qz_history', qzHistory);

  for(const s of (oldStores.ps_subjects||[])){
    const f = await zCreateFolder('ps_folders', ZROOT, s.name);
    psFolderMap['s'+s.id] = f.id;
  }
  const psPassages = (oldStores.ps_passages||[]).map(p=>{
    const newId = zNewId();
    psPassageMap['p'+p.id] = newId;
    return { id:newId, folderId:psFolderMap['s'+p.subjectId], title:p.title, text:p.text, order:p.order||0, lastResult: p.lastResult!=null?p.lastResult:null };
  });
  await zBulkPut('ps_passages', psPassages);
  const psHistory = (oldStores.ps_history||[]).filter(h=>psPassageMap['p'+h.passageId]).map(h=>({
    id:zNewId(), passageId:psPassageMap['p'+h.passageId], date:h.date, score:h.score, method:h.method, wpm:h.wpm!=null?h.wpm:null, hour:h.hour
  }));
  await zBulkPut('ps_history', psHistory);
}

const FIXED_HABIT_DEFS = [
  { key:'fajr', name:'Fajr', type:'check' },
  { key:'dhuhr', name:'Dhuhr', type:'check' },
  { key:'asr', name:'Asr', type:'check' },
  { key:'maghrib', name:'Maghrib', type:'check' },
  { key:'isha', name:'Isha', type:'check' },
  { key:'hygiene_morning', name:'Morning hygiene', type:'check' },
  { key:'hygiene_evening', name:'Evening hygiene', type:'check' },
  { key:'quran', name:'Quran', type:'check' },
  { key:'sleep', name:'Sleep', type:'quantity', unit:'hours' },
  { key:'water', name:'Water', type:'counter', unit:'cups' },
];

async function zMigrateHabits(oldStores){
  const defs = await zHabitDefs();
  const byKey = {};
  let order = defs.length;
  for(const d of FIXED_HABIT_DEFS){
    let existing = defs.find(x=>x._migKey === d.key);
    if(!existing){
      existing = { id:zNewId(), name:d.name, type:d.type, unit:d.unit||null, target:null, order:order++, _migKey:d.key };
      await zPut('habit_defs', existing);
    }
    byKey[d.key] = existing.id;
  }

  for(const day of (oldStores.hb_days||[])){
    const date = day.date;
    if(day.prayers){
      for(const p of ['fajr','dhuhr','asr','maghrib','isha']){
        if(p in day.prayers) await zPut('habit_logs', { id:zLogId(byKey[p],date), habitId:byKey[p], date, value: !!day.prayers[p] });
      }
    }
    if(day.hygiene){
      if('morning' in day.hygiene) await zPut('habit_logs', { id:zLogId(byKey.hygiene_morning,date), habitId:byKey.hygiene_morning, date, value: !!day.hygiene.morning });
      if('evening' in day.hygiene) await zPut('habit_logs', { id:zLogId(byKey.hygiene_evening,date), habitId:byKey.hygiene_evening, date, value: !!day.hygiene.evening });
    }
    if('quran' in day) await zPut('habit_logs', { id:zLogId(byKey.quran,date), habitId:byKey.quran, date, value: !!day.quran });
    if(typeof day.sleepHours === 'number') await zPut('habit_logs', { id:zLogId(byKey.sleep,date), habitId:byKey.sleep, date, value: day.sleepHours });
    if(typeof day.water === 'number') await zPut('habit_logs', { id:zLogId(byKey.water,date), habitId:byKey.water, date, value: day.water });
    // day.tasks (old numeric-keyed task toggles) has no name metadata in
    // the source backup (hb_tasks was empty) — nothing to attach the
    // done-state to, so it's intentionally skipped rather than guessed.
  }

  // sched_days: recurring named daily tasks become checkbox habits,
  // named by their recurring text.
  const taskNameToId = {};
  const freshDefs = await zHabitDefs();
  freshDefs.forEach(d=>{ if(d._migSchedName) taskNameToId[d._migSchedName] = d.id; });
  let taskOrder = freshDefs.length;
  for(const day of (oldStores.sched_days||[])){
    for(const item of (day.items||[])){
      if(!item.text) continue;
      if(!taskNameToId[item.text]){
        const nd = { id:zNewId(), name:item.text, type:'check', unit:null, target:null, order:taskOrder++, _migSchedName:item.text };
        await zPut('habit_defs', nd);
        taskNameToId[item.text] = nd.id;
      }
      const hid = taskNameToId[item.text];
      await zPut('habit_logs', { id:zLogId(hid, day.date), habitId:hid, date:day.date, value: !!item.done });
    }
  }
}

async function zMigrateLibrary(oldStores){
  const genreMap = {};
  for(const g of (oldStores.bk_genres||[])){
    const ng = { id:zNewId(), name:g.name, order:g.order||0 };
    await zPut('bk_genres', ng);
    genreMap['g'+g.id] = ng.id;
  }
  const books = (oldStores.bk_books||[]).filter(b=>genreMap['g'+b.genreId]).map(b=>({
    id:zNewId(), genreId:genreMap['g'+b.genreId], title:b.title, totalPages:b.totalPages||1,
    pagesRead:b.pagesRead||0, order:b.order||0, cover:null, pinned:false, lastReadAt:null
  }));
  await zBulkPut('bk_books', books);
}

async function zMigrateCourses(oldStores){
  const courses = (oldStores.hb_courses||[]).map(c=>{
    const base = { id:zNewId(), name:c.name, mode:c.mode, order:c.order||0 };
    if(c.mode === 'checkbox') return {...base, totalVideos:c.totalVideos||1, videosDone:(c.videosDone||[]).slice()};
    return {...base, totalMinutes:c.totalMinutes||1, completedMinutes:c.completedMinutes||0};
  });
  await zBulkPut('hb_courses', courses);
}

async function zRestoreBackup(newStores){
  for(const name of ZDB_STORES){
    await zClearStore(name);
    if(newStores[name]) await zBulkPut(name, newStores[name]);
  }
}

/* deck-import shape:
   { app:'zenith', type:'deck-import', module:'fc'|'qz'|'ps',
     path:['Subject','Unit'], items:[ ...module-specific fields ] } */
async function zImportDeck(json){
  const mod = json.module;
  const folderStore = mod+'_folders';
  const itemStore = mod === 'fc' ? 'fc_cards' : mod === 'qz' ? 'qz_quizzes' : 'ps_passages';
  // Root only ever renders subfolders, never items directly — a deck
  // import must always land at least one level deep or it becomes
  // invisible in the UI. Fall back to an "Imported" folder if the
  // file didn't specify a path.
  const path = (json.path && json.path.length) ? json.path : ['Imported'];
  const folderId = await zResolvePath(folderStore, path);
  const existing = await zFolderItems(itemStore, folderId);
  let order = existing.length;
  const rows = (json.items||[]).map(raw=>{
    const base = { id:zNewId(), folderId, order:order++ };
    if(mod === 'fc') return {...base, front:raw.front, back:raw.back, interval:0, dueDate:null, reps:0, lastResult:null, ease:2.5, lapses:0, isLeech:false};
    if(mod === 'qz') return {...base, question:raw.question, options:raw.options||[], explanation:raw.explanation||'', lastResult:null, reps:0};
    return {...base, title:raw.title||'', text:raw.text||''};
  });
  await zBulkPut(itemStore, rows);
  return { count: rows.length, path };
}

async function zHandleImportFile(file, mode){
  const text = await file.text();
  let json;
  try{ json = JSON.parse(text); }catch(e){ zToast('That file isn\'t valid JSON.'); return; }

  if(json.type === 'deck-import'){
    const { count, path } = await zImportDeck(json);
    zToast(`Imported ${count} item${count===1?'':'s'} into ${path.join(' / ')}.`);
    zRenderStudy();
    return;
  }
  // fc_folders only exists in the new schema, so it's an unambiguous
  // signal — check it first. bk_genres/hb_courses are unfortunately
  // store names shared between old and new schema (never renamed),
  // so they must NOT be used to detect "old format" — a genuine
  // new-format backup legitimately contains them too, and checking
  // them here caused real new-format imports to be misdetected as
  // old-format, silently skipping Study and Habits migration entirely.
  if(json.stores && json.stores.fc_folders){
    if(!confirm('This is a full Zenith backup. This will REPLACE all current data. Continue?')) return;
    await zRestoreBackup(json.stores);
    zToast('Backup restored.');
    zRenderStudy();
    if(document.querySelector('.tabview[data-view="habits"]').classList.contains('active')) zRenderHabits();
    if(document.querySelector('.tabview[data-view="library"]').classList.contains('active')) zRenderLibrary();
    if(document.querySelector('.tabview[data-view="courses"]').classList.contains('active')) zRenderCourses();
    return;
  }
  if(json.stores && (json.stores.fc_subjects || json.stores.hb_days || json.stores.sched_days)){
    if(!confirm('This is an old-format backup. Import and convert it into the new structure? (Existing data is kept, this only adds.)')) return;
    if(json.stores.fc_subjects) await zMigrateLegacy(json.stores);
    if(json.stores.hb_days || json.stores.sched_days) await zMigrateHabits(json.stores);
    if(json.stores.bk_genres) await zMigrateLibrary(json.stores);
    if(json.stores.hb_courses) await zMigrateCourses(json.stores);
    zToast('Old backup migrated into the new structure.');
    zRenderStudy();
    if(document.querySelector('.tabview[data-view="habits"]').classList.contains('active')) zRenderHabits();
    if(document.querySelector('.tabview[data-view="library"]').classList.contains('active')) zRenderLibrary();
    if(document.querySelector('.tabview[data-view="courses"]').classList.contains('active')) zRenderCourses();
    return;
  }
  zToast("Couldn't recognize this file's format.");
}

async function zExportBackup(){
  const dump = { app:'zenith', version:1, exportedAt:new Date().toISOString(), stores:{} };
  for(const name of ZDB_STORES){ dump.stores[name] = await zGetAll(name); }
  const blob = new Blob([JSON.stringify(dump)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `zenith-backup-${zLocalISODate()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function zToast(msg){
  let t = document.getElementById('zToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'zToast';
    t.style.cssText = 'position:fixed;left:50%;bottom:calc(var(--nav-h) + 24px);transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:12px;font-size:13px;z-index:600;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:86vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; }, 2600);
}

function zApplyTheme(){
  const theme = localStorage.getItem('zenith_theme') || 'summit';
  const mode = localStorage.getItem('zenith_mode') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.setAttribute('data-mode', mode);
}
function zSetTheme(theme){
  localStorage.setItem('zenith_theme', theme);
  zApplyTheme();
  zRenderThemeGrid();
}
function zSetMode(mode){

  zApplyTheme();

  const grid = document.getElementById('themeGrid');

      <span class="swatch-name">${t.name}</span>

}

  `);

/* ============================================================
   CHART HELPERS (plain SVG, no external library — stays offline)
   ============================================================ */
function zRingSvg(pct, size, color){
  pct = Math.max(0, Math.min(100, pct));
  const r = size/2 - 6;
  const c = 2*Math.PI*r;
  const offset = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-size="${Math.round(size*0.22)}" font-weight="700" fill="var(--text)">${Math.round(pct)}%</text>
  </svg>`;
}
function zSparklineSvg(points, width, height, color){
  if(points.length < 2) return `<div style="font-size:11.5px; color:var(--text-muted); padding:10px 0;">Not enough history yet — this fills in as you study.</div>`;
  const stepX = width/(points.length-1);
  const coords = points.map((p,i)=>`${(i*stepX).toFixed(1)},${(height-(Math.max(0,Math.min(100,p))/100)*height).toFixed(1)}`).join(' ');
  return `<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" style="width:100%; height:${height}px;">
    <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function zStackedBarHtml(buckets, total, colors, labels){
  if(!total) return `<div style="font-size:11.5px; color:var(--text-muted); padding:6px 0;">No cards yet.</div>`;
  const segs = Object.keys(buckets).map(k=>{
    const v = buckets[k];
    return v > 0 ? `<div style="flex:${v}; background:${colors[k]};"></div>` : '';
  }).join('');
  const legend = Object.keys(buckets).map(k=>`<span style="display:inline-flex; align-items:center; gap:4px; font-size:10.5px; color:var(--text-muted); margin-right:10px;"><span style="width:8px; height:8px; border-radius:2px; background:${colors[k]}; display:inline-block;"></span>${labels[k]} (${buckets[k]})</span>`).join('');
  return `<div style="display:flex; height:14px; border-radius:8px; overflow:hidden; margin-bottom:8px; background:var(--surface-2);">${segs}</div><div>${legend}</div>`;
}

/* ============================================================
   DASHBOARD
   ============================================================ */
/* A checkbox habit is either done or not. A counter/quantity habit
   with a target set gets proportional credit (e.g. 1hr of an 8hr
   sleep target = 0.125, not "fully done"). Without a target there's
   nothing to measure progress against, so it falls back to simple
   logged-or-not, same as before. */
function zHabitCompletionCredit(def, log){
  if(!log || log.value == null || log.value === false) return 0;
  if(def.type === 'check') return log.value ? 1 : 0;
  if(def.target) return Math.min(1, log.value / def.target);
  return log.value > 0 ? 1 : 0;
}

async function zDashboardHabitPct(){
  const defs = await zHabitDefs();
  if(!defs.length) return null;
  const logs = await zHabitLogsForDate(zTodayISO());
  let credit = 0;
  defs.forEach(d=>{
    const log = logs.find(l=>l.habitId===d.id);
    credit += zHabitCompletionCredit(d, log);
  });
  return { done:Math.round(credit), total:defs.length, pct: Math.round((credit/defs.length)*100) };
}
async function zDashboardDue(){
  const items = await zCollectItemsRecursive('fc_folders','fc_cards', ZROOT);
  const today = zTodayISO();
  const due = items.filter(c=>!c.dueDate || c.dueDate<=today);
  return { due:due.length, total:items.length };
}
async function zDashboard7DayHabitStrip(){
  const defs = await zHabitDefs();
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dateStr = zLocalISODate(d);
    const logs = await zHabitLogsForDate(dateStr);
    let credit = 0;
    defs.forEach(def=>{ const l = logs.find(x=>x.habitId===def.id); credit += zHabitCompletionCredit(def, l); });
    days.push({ dateStr, pct: defs.length ? credit/defs.length : 0, label: d.toLocaleDateString(undefined,{weekday:'narrow'}) });
  }
  return days;
}
async function zDashboardReviewAllDue(){
  const items = await zCollectItemsRecursive('fc_folders','fc_cards', ZROOT);
  if(!items.length){ zToast('No flashcards yet — add some in Study.'); return; }
  zStartFlashcardSession(items);
}

async function zRenderDashboard(){
  const root = document.getElementById('dashboardRoot');
  if(!root) return;

  const habitPct = await zDashboardHabitPct();
  const due = await zDashboardDue();
  const strip = await zDashboard7DayHabitStrip();
  const courses = await zCourses();
  const books = await zGetAll('bk_books');
  const bkLogs = await zGetAll('bk_logs');
  const todayLog = bkLogs.find(l=>l.id===zTodayISO());
  const reading = books.filter(b=>b.pagesRead>0 && b.pagesRead<b.totalPages).sort((a,b)=>(b.lastReadAt||'').localeCompare(a.lastReadAt||'')).slice(0,3);

  let html = `<div class="ring-row">`;
  if(habitPct){
    html += `<div class="ring-item">${zRingSvg(habitPct.pct, 92, 'var(--accent)')}<div class="ring-label">Habits today (${habitPct.done}/${habitPct.total})</div></div>`;
  }
  html += `</div>`;

  html += `<div class="zcard dash-due-card" onclick="zDashboardReviewAllDue()">
    <div><div class="dash-due-num">${due.due}</div><div class="dash-due-sub">flashcards due${due.total?` of ${due.total} total`:''}</div></div>
    <div style="font-size:20px; color:var(--text-muted);">▶</div>
  </div>`;

  if(strip.some(d=>d.pct > 0) || (await zHabitDefs()).length){
    html += `<div class="zsection-title">Last 7 days</div>
      <div class="streak-strip">
        ${strip.map(d=>`<div class="streak-col"><div class="streak-cell" style="opacity:${Math.max(0.12, d.pct)};"></div><div class="streak-cell-label">${d.label}</div></div>`).join('')}
      </div>`;
  }

  if(courses.length){
    html += `<div class="zsection-title">Courses</div><div class="zcard" style="margin-bottom:20px;">`;
    courses.forEach(c=>{
      let pct;
      if(c.mode === 'checkbox'){ const doneN = (c.videosDone||[]).filter(Boolean).length; pct = c.totalVideos ? Math.round((doneN/c.totalVideos)*100) : 0; }
      else pct = c.totalMinutes ? Math.min(100, Math.round((c.completedMinutes/c.totalMinutes)*100)) : 0;
      html += `<div class="dash-course-row">
        <div class="dash-course-name">${zBidi(c.name)}</div>
        <div class="dash-course-bar"><div class="dash-course-fill" style="width:${pct}%"></div></div>
        <div class="dash-course-pct">${pct}%</div>
      </div>`;
    });
    html += `</div>`;
  }

  if(reading.length || todayLog){
    html += `<div class="zsection-title">Reading</div>`;
    if(todayLog) html += `<p style="font-size:12.5px; color:var(--text-muted); margin:0 0 10px;">${todayLog.pages} pages read today</p>`;
    if(reading.length){
      html += `<div class="lib-scroll">${reading.map(b=>zBookCoverItemHtml(b)).join('')}</div>`;
    }
  }

  if(!habitPct && !due.total && !courses.length && !reading.length){
    html = `<div class="zempty"><div class="ph-icon">◎</div><p>Add some habits, flashcards, courses or books and your daily overview shows up here.</p></div>`;
  }

  root.innerHTML = html;
}

   INSIGHTS
   ============================================================ */
async function zRenderInsights(){
  const cards = await zGetAll('fc_cards');
  const quizzes = await zGetAll('qz_quizzes');
  const fcHistory = (await zGetAll('fc_history')).sort((a,b)=>a.date.localeCompare(b.date));
  const qzHistory = (await zGetAll('qz_history')).sort((a,b)=>a.date.localeCompare(b.date));
  const leeches = cards.filter(c=>c.isLeech);
  const dueToday = cards.filter(c=>!c.dueDate || c.dueDate<=zTodayISO());
  const wrongQuizzes = quizzes.filter(q=>q.lastResult==='incorrect');

  const buckets = {new:0, learning:0, young:0, mature:0};
  cards.forEach(c=>{
    const iv = c.interval||0;
    if(iv < 1) buckets.new++;
    else if(iv < 7) buckets.learning++;
    else if(iv < 21) buckets.young++;
    else buckets.mature++;
  });
  const bucketColors = {new:'var(--text-muted)', learning:'var(--danger)', young:'var(--accent-2)', mature:'var(--success)'};
  const bucketLabels = {new:'New', learning:'Learning', young:'Young', mature:'Mature'};

  const retentionPoints = fcHistory.slice(-14).map(h=>h.total ? Math.round((h.knew/h.total)*100) : 0);
  const accuracyPoints = qzHistory.slice(-14).map(h=>h.total ? Math.round((h.correct/h.total)*100) : 0);

  let mastery = `
    <div class="insights-section">
      <div class="insights-section-title">Flashcard mastery</div>
      <div class="insights-stat-row">
        <div class="insights-stat"><b>${cards.length}</b><span>total cards</span></div>
        <div class="insights-stat"><b>${dueToday.length}</b><span>due today</span></div>
        <div class="insights-stat" style="cursor:pointer;" onclick="zShowLeechesModal()"><b>${leeches.length}</b><span>leeches</span></div>
      </div>
      ${zStackedBarHtml(buckets, cards.length, bucketColors, bucketLabels)}
      <div style="margin-top:14px; font-size:11.5px; color:var(--text-muted);">Retention over recent sessions</div>
      ${zSparklineSvg(retentionPoints, 300, 60, 'var(--accent)')}
    </div>
    <div class="insights-section">
      <div class="insights-section-title">Quiz mastery</div>
      <div class="insights-stat-row">
        <div class="insights-stat"><b>${quizzes.length}</b><span>total questions</span></div>
        <div class="insights-stat"><b>${wrongQuizzes.length}</b><span>needs review</span></div>
      </div>
      <div style="font-size:11.5px; color:var(--text-muted); margin-bottom:6px;">Accuracy over recent sessions</div>
      ${zSparklineSvg(accuracyPoints, 300, 60, 'var(--accent-2)')}
      ${wrongQuizzes.length ? `
        <div style="margin-top:14px;">
          ${wrongQuizzes.slice(0,8).map(q=>`
            <div class="insights-list-row" onclick="zStudyLocateFolder('qz','${q.folderId}')">
              <span>${zBidi(q.question.slice(0,60))}</span><span class="chev">›</span>
            </div>`).join('')}
        </div>` : ''}
    </div>
  `;

  const habitDefs = await zHabitDefs();
  let habitsSection = '';
  if(habitDefs.length){
    const strip14 = [];
    for(let i=13;i>=0;i--){
      const d = new Date(); d.setDate(d.getDate()-i);
      const dateStr = zLocalISODate(d);
      const logs = await zHabitLogsForDate(dateStr);
      let credit = 0;
      habitDefs.forEach(def=>{ const l = logs.find(x=>x.habitId===def.id); credit += zHabitCompletionCredit(def, l); });
      strip14.push(habitDefs.length ? Math.round((credit/habitDefs.length)*100) : 0);
    }
    const avg14 = Math.round(strip14.reduce((a,b)=>a+b,0)/strip14.length);
    habitsSection = `
      <div class="insights-section">
        <div class="insights-section-title">Habits</div>
        <div class="insights-stat-row">
          <div class="insights-stat"><b>${habitDefs.length}</b><span>tracked</span></div>
          <div class="insights-stat"><b>${avg14}%</b><span>avg last 14 days</span></div>
        </div>
        ${zSparklineSvg(strip14, 300, 50, 'var(--success)')}
      </div>`;
  }

  const books = await zGetAll('bk_books');
  const bkLogs = await zGetAll('bk_logs');
  const totalPagesAllTime = bkLogs.reduce((s,l)=>s+(l.pages||0),0);
  const finishedBooks = books.filter(b=>b.pagesRead >= b.totalPages && b.totalPages>0);
  let librarySection = books.length ? `
    <div class="insights-section">
      <div class="insights-section-title">Library</div>
      <div class="insights-stat-row">
        <div class="insights-stat"><b>${totalPagesAllTime}</b><span>pages logged</span></div>
        <div class="insights-stat"><b>${finishedBooks.length}</b><span>books finished</span></div>
        <div class="insights-stat"><b>${books.length}</b><span>total books</span></div>
      </div>
    </div>` : '';

  const courses = await zCourses();
  let coursesSection = '';
  if(courses.length){
    const pcts = courses.map(c=>{
      if(c.mode === 'checkbox'){ const doneN=(c.videosDone||[]).filter(Boolean).length; return c.totalVideos ? (doneN/c.totalVideos)*100 : 0; }
      return c.totalMinutes ? Math.min(100,(c.completedMinutes/c.totalMinutes)*100) : 0;
    });
    const avgPct = Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    coursesSection = `
      <div class="insights-section">
        <div class="insights-section-title">Courses</div>
        <div class="insights-stat-row">
          <div class="insights-stat"><b>${courses.length}</b><span>courses</span></div>
          <div class="insights-stat"><b>${avgPct}%</b><span>avg completion</span></div>
        </div>
      </div>`;
  }

  zOpenModal('Insights', mastery + habitsSection + librarySection + coursesSection);
}

async function zCourses(){ return (await zGetAll('hb_courses')).sort((a,b)=>(a.order||0)-(b.order||0)); }

function zCourseCardHtml(c){

  return `

function zOpenAddCourseModal(){

    <div class="zform-field">

async function zSaveCourse(){
  const name = document.getElementById('fldCourseName').value.trim();
  if(!name) return;
  const mode = document.querySelector('.mode-select-card.selected').dataset.mode;
  const total = Math.max(1, Number(document.getElementById('fldCourseTotal').value) || 1);
  const courses = await zCourses();
  const base = { id:zNewId(), name, mode, order:courses.length };
  const course = mode === 'checkbox'
    ? {...base, totalVideos:total, videosDone:new Array(total).fill(false)}
    : {...base, totalMinutes:total, completedMinutes:0};
  await zPut('hb_courses', course);
  zCloseModal();
  zRenderCourses();
}
async function zOpenCourseDetail(id){
  const course = (await zCourses()).find(c=>c.id===id);
  if(course.mode === 'checkbox'){
    zOpenModal(course.name, `
      <div class="course-video-grid" id="courseVideoGrid">
        ${course.videosDone.map((done,i)=>`<div class="course-video-chip ${done?'done':''}" data-i="${i}">${i+1}</div>`).join('')}
      </div>
      <div class="zform-actions" style="margin-top:16px;"><button class="zbtn zbtn-accent" style="flex:1" onclick="zCloseModal(); zRenderCourses();">Done</button></div>
    `, (body)=>{
      body.querySelectorAll('.course-video-chip').forEach(chip=>{
        chip.addEventListener('click', async ()=>{
          const i = Number(chip.dataset.i);
          course.videosDone[i] = !course.videosDone[i];
          chip.classList.toggle('done', course.videosDone[i]);
          await zPut('hb_courses', course);
        });
      });
    });
  } else {
    zOpenModal(course.name, `
      <div class="zform-field"><label>Completed minutes</label><input id="fldCompletedMin" type="number" min="0" value="${course.completedMinutes}"></div>
      <div class="zform-field">
        <label>Add minutes</label>
        <div style="display:flex; gap:8px;">
          <input id="fldAddMin" type="number" min="1" value="15" style="flex:1;">
          <button class="zbtn zbtn-accent" style="flex:0 0 auto;" id="btnAddMin">+ Add</button>
        </div>
      </div>
      <div class="zform-actions"><button class="zbtn zbtn-accent" style="flex:1" id="btnCourseDone">Done</button></div>
    `, (body)=>{
      body.querySelector('#btnAddMin').addEventListener('click', ()=>{
        const inp = body.querySelector('#fldCompletedMin');
        const add = Number(body.querySelector('#fldAddMin').value) || 0;
        inp.value = Math.min(course.totalMinutes, Number(inp.value) + add);
      });
      body.querySelector('#btnCourseDone').addEventListener('click', async ()=>{
        course.completedMinutes = Math.max(0, Math.min(course.totalMinutes, Number(body.querySelector('#fldCompletedMin').value) || 0));
        await zPut('hb_courses', course);
        zCloseModal();
        zRenderCourses();
      });
    });
  }
}
async function zDeleteCourse(id){
  if(!confirm('Delete this course?')) return;
  await zDel('hb_courses', id);
  zRenderCourses();
}

async function zLogBookPages(id){

  book.pagesRead = Math.min(book.totalPages, book.pagesRead + add);
  book.lastReadAt = zTodayISO();
  await zPut('bk_books', book);
  const today = zTodayISO();
  const logs = await zGetAll('bk_logs');

  zToast(`+${add} pages logged.`);

function zTodayISO(){ return zLocalISODate(); }
function zLogId(habitId, date){ return habitId + '_' + date; }
async function zHabitDefs(){
  const all = await zGetAll('habit_defs');
  return all.sort((a,b)=>(a.order||0)-(b.order||0));
}
async function zHabitLogsForDate(date){ return zGetAll('habit_logs', 'date', date); }

let zHabitState = { date: zTodayISO() };

function zHabitDateLabel(date){
  const today = zTodayISO();
  if(date === today) return 'Today';
  const d = new Date(date + 'T00:00:00');
  const y = new Date(); y.setDate(y.getDate()-1);
  if(date === zLocalISODate(y)) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
function zHabitShiftDate(delta){
  const d = new Date(zHabitState.date + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  zHabitState.date = zLocalISODate(d);
  zRenderHabits();
}

async function zRenderHabits(){
  const root = document.getElementById('habitsRoot');
  if(!root) return;
  const defs = await zHabitDefs();
  const logs = await zHabitLogsForDate(zHabitState.date);
  const logMap = {};
  logs.forEach(l=>logMap[l.habitId]=l);

  const nav = `
    <div class="study-toolbar" style="align-items:center;">
      <button class="zbtn" style="flex:0 0 44px;" onclick="zHabitShiftDate(-1)">‹</button>
      <button class="zbtn" style="flex:1; font-weight:700;" onclick="zHabitState.date=zTodayISO(); zRenderHabits();">${zHabitDateLabel(zHabitState.date)}</button>
      <button class="zbtn" style="flex:0 0 44px;" onclick="zHabitShiftDate(1)" ${zHabitState.date>=zTodayISO()?'disabled':''}>›</button>
    </div>
  `;

  if(!defs.length){
    root.innerHTML = nav + `<div class="zempty"><div class="ph-icon">☑</div><p>No habits yet. Tap "+ Add habit" to create your first one.</p></div>`;
    return;
  }

  root.innerHTML = nav + `<div class="folder-list">${defs.map(d=>zHabitRowHtml(d, logMap[d.id])).join('')}</div>`;
}

function zHabitRowHtml(def, log){
  const val = log ? log.value : (def.type==='check' ? false : 0);
  if(def.type === 'check'){
    return `
      <div class="folder-row" onclick="zToggleCheckHabit('${def.id}')">
        <span class="ficon" style="color:${val?'var(--success)':'var(--text-muted)'}">${val?'☑':'☐'}</span>
        <div class="finfo"><div class="fname">${zBidi(def.name)}</div></div>
        <button class="fmore" onclick="event.stopPropagation(); zHabitActions('${def.id}')">⋮</button>
      </div>`;
  }
  if(def.type === 'counter'){
    return `
      <div class="folder-row" onclick="event.stopPropagation()">
        <span class="ficon">◔</span>
        <div class="finfo"><div class="fname">${zBidi(def.name)}</div>
          <div class="fmeta">${val} ${def.unit||''}${def.target?(' / '+def.target):''}</div></div>
        <div style="display:flex; gap:4px;">
          <button class="reader-fsbtn" onclick="event.stopPropagation(); zBumpCounter('${def.id}', -1)">−</button>
          <button class="reader-fsbtn" onclick="event.stopPropagation(); zBumpCounter('${def.id}', 1)">+</button>
        </div>
        <button class="fmore" onclick="event.stopPropagation(); zHabitActions('${def.id}')">⋮</button>
      </div>`;
  }
  // quantity
  return `
    <div class="folder-row" onclick="zOpenQuantityEntry('${def.id}')">
      <span class="ficon">✎</span>
      <div class="finfo"><div class="fname">${zBidi(def.name)}</div>
        <div class="fmeta">${val ? val+' '+(def.unit||'') : 'Tap to log'}${def.target?(' / '+def.target+(def.unit?' '+def.unit:'')):''}</div></div>
      <button class="fmore" onclick="event.stopPropagation(); zHabitActions('${def.id}')">⋮</button>
    </div>`;
}

async function zToggleCheckHabit(habitId){
  const logs = await zHabitLogsForDate(zHabitState.date);
  const existing = logs.find(l=>l.habitId===habitId);
  const newVal = !(existing && existing.value);
  await zPut('habit_logs', { id:zLogId(habitId, zHabitState.date), habitId, date:zHabitState.date, value:newVal });
  zRenderHabits();
}
async function zBumpCounter(habitId, delta){
  const logs = await zHabitLogsForDate(zHabitState.date);
  const existing = logs.find(l=>l.habitId===habitId);
  const newVal = Math.max(0, (existing ? existing.value : 0) + delta);
  await zPut('habit_logs', { id:zLogId(habitId, zHabitState.date), habitId, date:zHabitState.date, value:newVal });
  zRenderHabits();
}
async function zOpenQuantityEntry(habitId){
